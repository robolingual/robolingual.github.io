<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- maximum-scale と user-scalable は iOS が無視するので拡大は止められず、
     それでいてピンチでの縮小だけは効かなくなり、一度拡大されると戻せなくなる。
     外しておけば、万一拡大されてもピンチで戻せる。拡大させない対策は別途JS側。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Robolingual v1.0</title>
<style>
/* ---------------------------------------------------------------
   Robolingual スタイルシート

   v0.9.41 で、v0.9.17〜v0.9.29 にかけて積み上がった 5 世代分の
   上書きレイヤーを整理した。カスケードの結果は変えず、
   「後から同じセレクタで再宣言されて必ず負ける宣言」だけを削除している
   （宣言の位置は動かしていないため、他セレクタとの勝敗関係は不変）。

   併せて、対応する要素が存在しないセレクタと、
   scale-wrap 方式（固定 628px を transform:scale で画面に収める）へ
   移行したことで不要になったメディアクエリを削除した。
   --------------------------------------------------------------- */
*{box-sizing:border-box}
body{margin:0}
.window{border:2px solid var(--ink);background:var(--panel);box-shadow:6px 6px 0 var(--shadow)}
.titlebar{gap:8px;padding:0 8px;font-weight:400}
.title{padding:2px 10px;margin:auto}
.row{display:grid;gap:12px;align-items:center;margin-bottom:12px}
button,input,select{font:inherit}
button,select{appearance:none;border:2px solid var(--ink);background:#e9e9e9;color:var(--ink);box-shadow:2px 2px 0 #777;padding:10px 14px;cursor:pointer;font-weight:400;border-radius:0}
button:active{box-shadow:none;transform:translate(2px,2px)}
button:disabled{cursor:not-allowed}
input[type=file]{display:none}
#waveBox{position:relative;width:100%}
#wave{display:block}
#bpm{width:92px;border:2px solid var(--ink);background:#fff;padding:9px;border-radius:0;font-weight:400}
#translate{width:100%;font-size:20px;padding:15px;background:var(--ink);color:#fff;box-shadow:4px 4px 0 #777;margin:4px 0 14px}
.mode-head{justify-content:space-between}
.switches input{position:absolute;opacity:0;pointer-events:none}
.switches label{cursor:pointer}
.mixer-main{min-width:0}
.speed-panel{align-items:center}
.speed-scale{display:grid;grid-template-columns:36px 32px;align-items:stretch;justify-content:center;gap:4px}
.speed-labels{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:11px;padding:4px 0}
.speed-slider{width:32px;height:100%;writing-mode:vertical-lr;direction:rtl;cursor:ns-resize}
#waveBox{overflow:hidden}
#waveStatus{position:absolute;left:12px;right:12px;z-index:4;font-weight:900;text-align:center;pointer-events:none}
.performance-controls{display:grid}
.performance-controls button{min-width:0}
.play-led{background:#0b3517;color:#c9ffd5;border-color:#09260f;transition:background-color .25s,color .25s,box-shadow .25s}
.play-led.lit{background:#20d45a;color:#001b08;box-shadow:0 0 10px rgba(32,212,90,.9),2px 2px 0 #08752c}
.rec-led{background:#4a0b0b;color:#ffd0d0;border-color:#2b0505;transition:background-color .25s,color .25s,box-shadow .25s}
.rec-led.lit{background:#ff2525;color:#240000;box-shadow:0 0 10px rgba(255,37,37,.9),2px 2px 0 #9c0000}
.performance-controls button:disabled{opacity:.45}

/* ===== v0.9.57 — モックアップ実測に基づく筐体レイアウト =====================
   モックアップ(1532x2622)を実測し、コンテンツ幅1463pxを基準に比率を確定した。
     左ベイ202 / 隙間29 / 中央ベイ994 / 隙間36 / 右ベイ202  (合計1463)
   これを 720px 幅へ縮尺 0.470 で写している。
   最大の設計要素は「グレーの筐体(bay)」で、機能グループの境界そのものを担う。
   筐体の上に黒いキーキャップが載る、という2層構造が機材らしさの正体。
   ========================================================================= */
.scale-wrap{width:720px}
main{padding:16px;overflow:visible}
.window{min-height:0}

/* --- 行(モジュール) --- */
.deck-row{display:grid;grid-template-columns:95px 467px 95px;justify-content:space-between;align-items:stretch;margin:0 0 15px}
.deck-row:last-child{margin-bottom:0}
.deck-chaos{grid-template-columns:95px 277px 1fr;justify-content:start;column-gap:15px}

/* --- 筐体(シャーシ) --- */
.bay{background:linear-gradient(#c6c6c6,#a8a8a8);border-radius:16px;
     box-shadow:0 2px 5px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.14)}
.bay-side{padding:9px;display:flex;flex-direction:column;gap:9px}
.bay-main{padding:17px;display:flex;flex-direction:column;gap:12px}
.bay-chaos{padding:12px;display:flex}

/* --- 筐体に載る黒いキーキャップ --- */
.bay button{width:100%;background:linear-gradient(#242424,#080808);color:#e6e6e6;border:1px solid #000;
     border-radius:8px;box-shadow:0 3px 0 #7e7e7e,inset 0 1px 0 rgba(255,255,255,.10);
     font-size:11px;font-weight:700;letter-spacing:.04em;padding:9px 4px;line-height:1.2;height:auto;min-height:0;text-shadow:none}
.bay button:active{transform:translateY(3px);box-shadow:0 0 0 #7e7e7e,inset 0 1px 0 rgba(255,255,255,.10)}
.bay button:disabled{color:#5a5a5a;background:linear-gradient(#1c1c1c,#0c0c0c);box-shadow:0 3px 0 #8d8d8d}
.bay-side button{flex:1}
.play-led{color:#3ddc5c}
.play-led:disabled{color:#2c6b3a}
.rec-led{color:#ff3b3b}
.rec-led:disabled{color:#7a2626}
.choose-btn,.restart-btn{color:#aaff00;border-color:#000}
#translate{font-size:11px;font-weight:700;color:#e6e6e6;background:linear-gradient(#242424,#080808);
     border:1px solid #000;border-radius:8px;box-shadow:0 3px 0 #7e7e7e;width:100%;margin:0;padding:9px 4px;height:auto;min-height:0}
#translate:disabled{color:#5a5a5a;box-shadow:0 3px 0 #8d8d8d;background:linear-gradient(#1c1c1c,#0c0c0c)}

/* --- 波形スクリーン --- */
/* スリップループは波形を指でなぞって刻みを変える。ブラウザ既定の
   スクロール・選択・長押しメニュー・ダブルタップ拡大が割り込むと、
   途中でpointercancelが飛んでスライドが切れるので全て無効化する。
   カオスパッド(#chaosSection)と同じ扱い。 */
#waveBox{flex:1;min-height:0;height:auto;aspect-ratio:921/470;border-radius:6px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wave{width:100%;height:100%;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.preset-row{display:flex;gap:8px;margin:0}
.preset-btn{flex:1;background:linear-gradient(#242424,#080808);color:#aaff00;border:1px solid #000;
     border-radius:7px;box-shadow:0 3px 0 #7e7e7e;font-size:10px;font-weight:700;padding:8px 2px}
.preset-btn:active{transform:translateY(3px);box-shadow:0 0 0 #7e7e7e}
.preset-btn:disabled{color:#4d6b00;opacity:1;box-shadow:0 3px 0 #8d8d8d}

/* --- BPM表示(黒地に緑の数字) --- */
.bpm-panel{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
     background:#050505;border:1px solid #000;border-radius:8px;box-shadow:0 3px 0 #7e7e7e,inset 0 0 10px rgba(0,255,0,.06);
     padding:7px 4px;height:auto;min-height:0;overflow:visible;position:static;flex:1}
.bpm-panel #bpm{width:100%;text-align:center;background:transparent;border:0;box-shadow:none;outline:none;
     color:#aaff00;font:900 20px/1 monospace;padding:0}
.bpm-panel span{position:static;display:block;text-align:center;color:#7fbf00;font:900 9px/1 monospace;letter-spacing:.18em;margin-top:3px}

/* --- ミキサー: PAN列(筐体の外、白地に置く) --- */
.pan-col{position:relative;padding:17px 0;display:flex;flex-direction:column;gap:6px}
.pan-title{position:absolute;top:-2px;left:2px;font:900 10px/1 Arial,sans-serif;letter-spacing:.12em;color:#7fbf00}
.pan-unit{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:5px}
.pan-knob{display:block;width:100%}
.pan-slider{width:100%;height:14px;accent-color:#aaff00;cursor:ew-resize;display:block}
.name-bar{background:#0a0a0a;color:#e6e6e6;font:700 10px/1 Arial,sans-serif;letter-spacing:.08em;
     padding:6px 6px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* --- ミキサー: 16パッド(実測 213x229、行間12 → 縮尺後 100x108、行間6) --- */
#results{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;background:none;border:0;padding:0;margin:0}
.mode{display:flex;flex:1;min-height:0;background:none;border:0;padding:0;margin:0}
.switches{display:flex;gap:6px;flex:1;min-width:0}
.switches label{flex:1;height:108px;min-width:0;padding:0;display:flex;align-items:center;justify-content:center;
     font-size:17px;font-weight:400;border-radius:9px;border:1px solid #000;
     background:linear-gradient(#1d1d1d,#070707);color:#7a7a7a;box-shadow:0 3px 0 #7e7e7e,inset 0 1px 0 rgba(255,255,255,.06)}
.switches input:checked+label{background:linear-gradient(#c8ff3a,#8fd400);color:#0d1a00;
     box-shadow:0 0 16px rgba(170,255,0,.65),0 3px 0 #6f8f00;border-color:#000}
.switches input:disabled+label{color:#3a3a3a;background:linear-gradient(#171717,#060606);box-shadow:0 3px 0 #8d8d8d;cursor:not-allowed}

/* --- スピードパネル --- */
.bay-side .speed-panel{flex:1;width:100%;height:auto;min-height:0;background:#050505;border:1px solid #000;
     border-radius:8px;box-shadow:0 3px 0 #7e7e7e;padding:8px 4px;display:flex;flex-direction:column}
.effective-bpm{font:900 11px/1 monospace;color:#aaff00;text-align:center;margin:0 0 3px}
.speed-value{font:900 12px/1 monospace;color:#e6e6e6;text-align:center;margin:0 0 6px}

/* --- カオスパッド --- */
#chaosSection{background:none;border:0;padding:0;margin:0;touch-action:none;flex:1;display:flex}
#chaosPadWrap{position:relative;width:100%;aspect-ratio:1;margin:0}
#chaosPad{border-radius:12px;overflow:hidden}
#chaosBaguaImg{border-radius:12px}
#chaosHold.on,#chaosZeroLock.on{background:linear-gradient(#c8ff3a,#8fd400);color:#0d1a00;
     box-shadow:0 0 14px rgba(170,255,0,.6),0 3px 0 #6f8f00}
.chaos-spare{min-height:0}


/* カオス行の左ベイは2ボタンのみ。伸縮させると縦に間延びするので自然高にする */
.deck-chaos .bay-side{justify-content:flex-start}
.deck-chaos .bay-side button{flex:0 0 auto;padding:12px 4px}
#waveBox{position:relative}

/* ===== v0.9.58 — 16パッド周りの作り込み ==================================
   モックアップ実測:
     ・消灯パッドの色は rgb(24,82,21) = #185215 の深緑
     ・キャラ名の帯は行の下端にあり、PAN側からパッドの背後を通って
       右端まで連続して走っている(パッド間の隙間で帯が覗く)。
       これが「PANノブとA/B/C/Exが同じ行である」ことを示す仕掛け。
     ・パッドは 213x229、間隔27、行間12 → 縮尺0.470で 99x106、間隔13、行間6
   帯の色には、波形グリッドで各キャラに割り当てた色をそのまま使い、
   画面表示とミキサーの対応を一目で取れるようにした。
   ======================================================================== */

/* --- パッド寸法をモックアップ実測比に合わせ直す --- */
.switches{gap:13px;position:relative;z-index:1}
.switches label{height:106px}
#results{gap:6px}

/* --- 消灯: 深緑 / 点灯: 明るい緑 --- */
.switches label{
  background:linear-gradient(#1d6419,#123f10);
  color:rgba(214,255,200,.34);
  border:1px solid #061a05;
  box-shadow:0 3px 0 #7e7e7e,inset 0 1px 0 rgba(255,255,255,.10),inset 0 -6px 12px rgba(0,0,0,.35);
  transition:background .06s linear,box-shadow .06s linear,color .06s linear}
.switches input:checked+label{
  background:linear-gradient(#c4ff5a,#74d400);
  color:#0c2400;
  border-color:#3d6b00;
  box-shadow:0 0 20px rgba(150,255,40,.72),0 3px 0 #5f8f00,inset 0 1px 0 rgba(255,255,255,.5)}
.switches input:disabled+label{
  background:linear-gradient(#164013,#0c2a0a);
  color:rgba(214,255,200,.14);
  box-shadow:0 3px 0 #8d8d8d,inset 0 -6px 12px rgba(0,0,0,.35);
  cursor:not-allowed}

/* --- キャラの帯: PAN列からパッドの背後を通って右端まで --- */
.mode{position:relative}
.row-band{
  position:absolute;left:-127px;right:0;bottom:0;height:22px;z-index:0;
  border-radius:4px;display:flex;align-items:center;padding-left:9px;
  font:700 10px/1 Arial,Helvetica,sans-serif;letter-spacing:.10em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}
/* 帯は明るめに。文字は色を乗せず白で統一する。
   終端はスキンへ馴染ませたいので、始端より一段暗く落としている。 */
.mode[data-mode="ninja"]  .row-band{background:linear-gradient(90deg,#22b0b0,#0e4a4a);color:#fff}
.mode[data-mode="killer"] .row-band{background:linear-gradient(90deg,#c73a2e,#521712);color:#fff}
.mode[data-mode="banker"] .row-band{background:linear-gradient(90deg,#c09328,#4e3d10);color:#fff}
.mode[data-mode="witch"]  .row-band{background:linear-gradient(90deg,#a531bd,#43124d);color:#fff}

/* --- PAN列はノブが帯より前に出るよう重ね順を上げる --- */
.pan-col{z-index:2}
.pan-unit{padding-bottom:22px;justify-content:center}


/* ===== v0.9.59 — ボタン寸法の統一 ========================================
   モックアップ実測(左パネル x=140 / 右パネル x=1400 の縦スキャン):
     ボタン高さ 116px・間隔24px・上下余白22/23px が左右パネルで完全に一致。
     → 縮尺0.470で 高さ54px・間隔11px・余白10px
   これまでは flex:1 でボタンを引き伸ばしていたため、
   左(4個)と右(3個)でパネル高さの割り方が変わり、左右で寸法が食い違っていた。
   固定高さ＋上詰めに改め、余りは下側の余白として素直に残す。
   ======================================================================== */
.bay-side{padding:10px 9px;gap:11px;justify-content:flex-start}
.bay-side>button,.bay-side>.bpm-panel{flex:0 0 54px;height:54px;min-height:0}
.deck-chaos .bay-side>button{flex:0 0 54px;height:54px;padding:9px 4px}

/* スピードパネルだけは縦に伸ばす(スライダーの可動域を確保するため) */
.bay-side>.speed-panel{flex:1 1 auto;height:auto}

/* SAVEは .dl-wav の opacity:.4 で黒キーキャップが透け、灰色に見えていた */
.bay button:disabled{opacity:1}
.dl-wav{font-size:11px;color:inherit;background:none;border:0;border-radius:8px;letter-spacing:.04em}

/* BPM表示は数字を主役に、54px枠へ収める */
.bay-side>.bpm-panel{padding:5px 4px}
.bpm-panel #bpm{font-size:19px}
.bpm-panel span{margin-top:2px}


/* ===== v0.9.60 — 対称化と、余白からグレーを排除 ==========================
   ・右パネル最上段に空きキーを追加し、左右とも 54px x 4個 で対称にした。
   ・グレー筐体は「入力・表示を囲うもの」であって、余白を埋めるものではない。
     これまで筐体を行の高さいっぱいに引き伸ばしていた(align-items:stretch)ため、
     ボタンの下に意味のないグレーが伸びていた。中身の高さで止まるよう改める。
     ただしミキサー行だけは、PAN列・パッド・スピードスライダーの三者が
     互いに高さを揃える必要があるため stretch を維持する。
   ======================================================================== */
.deck-row{align-items:start}
.deck-mixer{align-items:stretch}

.bay-side>.blank-key{flex:0 0 54px;height:54px;border-radius:8px;border:1px solid #000;
  background:linear-gradient(#242424,#080808);
  box-shadow:0 3px 0 #7e7e7e,inset 0 1px 0 rgba(255,255,255,.10)}


/* ===== v0.9.61 — パッドは正方形、16個ブロックも正方形 ====================
   色を区別して測り直した結果(緑=パッド / 黒=帯):
     パッド 213 x 214 …… 正方形
     16個ブロック  933 x 934 …… 正方形
     帯は高さ47、うち33がパッドの背後、15がパッド下にはみ出して見える
     帯の右端は x=1233 = Exパッドの右端ちょうど
   前回は緑のパッドと黒い帯を一続きの暗部として測ってしまい、
   229pxの縦長パッドだと誤認していた。帯が「パッドの下に少しはみ出す」
   ことこそが、行のまとまりを示す仕掛けだった。

   縮尺0.470: パッド99角 / 間隔12 / 帯の高さ22 / はみ出し7
     4 x 99 + 3 x 12 = 432 → 縦横とも432の正方形ブロックになる
   ======================================================================== */
.switches{gap:12px}
.switches label{height:99px}          /* 幅も (433-36)/4 = 99 で正方形になる */
#results{gap:12px;flex:0 0 auto}
.mode{flex:0 0 99px;height:99px}

/* 帯: 下へ7pxはみ出させ、パッドに隠れない部分を作る */
.row-band{bottom:-7px;height:22px;padding-left:9px}

/* PAN列もパッド行と同じ刻みで揃える */
.pan-col{gap:12px}
.pan-unit{flex:0 0 99px;height:99px;padding-bottom:15px;justify-content:flex-end}


/* ===== v0.9.62 — 行間の余白と、筐体スキン層 ==============================
   モックアップ実測(縦):
     プレイヤー筐体 746 ↓ ミキサー筐体 802 …… 56px
     ミキサー筐体 1799 ↓ カオス筐体 1879 …… 80px  ← ここだけ意図的に広い
     カオス筐体 2462 ↓ 筐体下端 …… 約160px
   縮尺0.470 で 26 / 38 / 30px とした。
   (副産物: ミキサー筐体は 994 x 997 で、こちらも正方形だった)
   ======================================================================== */
main{padding:16px 16px 30px;position:relative}
.deck-row{margin-bottom:26px}
.deck-mixer{margin-bottom:38px}
.deck-row:last-child{margin-bottom:0}

/* --- 筐体スキン: 白いベースの上、グレー筐体の下に画像を敷く ---------------
   同じフォルダの skin.jpg を参照している。差し替えたいときは
   skin.jpg を置き換えるだけでよく、このファイルを触る必要はない。
   background-size:cover なので、多少の寸法差は自動で吸収される。       */
#deckSkin{--deck-skin:url("skin.jpg");
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:var(--deck-skin);background-size:cover;background-position:center;
  border-radius:0 0 14px 14px}
.deck-row{position:relative;z-index:1}

/* --- スキンの外側は黒に統一 -------------------------------------------
   スキン(#deckSkin)が映っている範囲より外に、明るい要素が額縁のように
   残っていたので黒に倒す。タイトルバーは意図的にそのまま残す。
     .window の背景  #f4f4f4 → 黒
     .window の枠線  #555    → 黒 (太さは2pxのまま。0にすると全体の寸法が
                               4px変わってscale計算まで動くため色だけ変える)
     .window の影    6px 6px 0 #ccc → 消す(右下に明るい帯として出ていた)
     body の内側リング inset 0 0 0 1px #e0e0e0 → 消す
   body自体の背景#030303は既に黒なので触らない。                       */
.window{background:#000;border-color:#000;box-shadow:none}
body{box-shadow:none}

/* --- ブラウザのジェスチャーを全体で無効化 -------------------------------
   スクロール・ピンチ拡大・ダブルタップ拡大・テキスト選択・長押しメニューが
   割り込むと、スライダーやパッドの操作が途中で奪われる。
   特にパンとテンポのスライダーには touch-action の指定が無く、
   横ドラッグがページのスクロール扱いになって触りづらかった。
   画面は scale-wrap でビューポートに収める作りでそもそもスクロールしない
   (body は overflow:hidden)ので、全面で切って差し支えない。
   数値入力だけは選択・編集できるよう戻す。                             */
/* パネルの外(下の黒い余白)も body なので、ここを外すとそこだけ
   ダブルタップ拡大が生きてしまう。html/body ごと切る。 */
html,body{touch-action:none;overscroll-behavior:none;
  /* パネルの外の黒い余白は body のままで、ここだけ選択が生きていた。
     ダブルタップで文字が選択されると iOS はその段落へ寄って拡大するので、
     余白も含めて選択を切る。 */
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent}

/* --- 画面いっぱい・上詰め ----------------------------------------------
   余白14pxのぶん横が痩せていたので0にして、画面の横幅を使い切る。
   縦は中央寄せをやめて上端から並べる(スマホでは横幅で拡大率が決まり、
   下に余りが出るため)。横方向は中央寄せのまま。                       */
body{align-items:flex-start;padding:0}

/* 拡大の基点を左上へ。中央基点のままだと、縮めた見た目が元寸(720px)の箱の
   真ん中に浮き、箱の左端が画面外へはみ出す。左上基点にしておけば、
   下の負マージンで箱を実寸まで詰めたときに見た目と箱がそのまま重なる。 */
.scale-wrap{transform-origin:top left}
.window,.window *{
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent}
.window input[type=number],.window input[type=text]{
  -webkit-user-select:text;user-select:text}

/* --- パッドの Ex ------------------------------------------------------
   HTMLは元から "Ex" だが、label に掛かる text-transform:uppercase が
   "EX" に見せていた。この4つだけ大文字化を解く。                       */
.switches label{text-transform:none}

/* --- Ex は点灯ではなく点滅 --------------------------------------------
   単発トリガーなので状態として点灯させ続けない。A/B/Cの点灯色をそのまま
   借りて、押した瞬間だけ光らせる。                                     */
/* --- BPMを16パッドで入力するモード -------------------------------------
   ネイティブのキーボードを出すと、iOS/Chrome が入力欄を見せようとして
   画面をずらす。レイアウトビューポートは動かない作りなので JS から戻せず、
   ずれたままになる。キーボードを出さずに済むよう、既にある16パッドを
   そのままテンキーとして使う。                                         */
/* 入力中の値とカーソル。BPM欄に重ねて出す。 */
/* .bpm-panel の position は後段の指定で static になっているので、
   重ねる基準にするためここで明示する。 */
body.bpm-editing .bpm-panel{position:relative}
#bpmEditView{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  gap:1px;background:#080808;color:#aaff00;font:700 17px/1 monospace;letter-spacing:.04em;
  text-shadow:0 0 10px rgba(170,255,0,.55)}
#bpmEditView[hidden]{display:none}
#bpmEditView i{display:inline-block;width:2px;height:13px;background:#aaff00;
  animation:bpmCaret 1s steps(1,end) infinite}
@keyframes bpmCaret{0%,50%{opacity:1}50.01%,100%{opacity:0}}
/* パッドをテンキーの見た目にする。無効状態の指定より強くする必要があるので
   body側のクラスも噛ませて詳細度を上げてある。 */
/* パッドの内寸は 97x97。収まる上限は数字が48px、CANCEL/ENTERが27px。
   記号と文字は必要な幅が違うので別々に持たせる。 */
body.bpm-editing .switches label.bpm-key{
  background:linear-gradient(#3d3d3d,#1c1c1c);color:#e8e8e8;border-color:#666;
  box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.14);
  font:700 34px/1 monospace;letter-spacing:0;opacity:1}
body.bpm-editing .switches label.bpm-key.bpm-key-fn{color:#9a9a9a;font-size:36px}
body.bpm-editing .switches label.bpm-key.bpm-key-word{font-size:18px}
body.bpm-editing .switches label.bpm-key.bpm-key-ent{
  background:linear-gradient(#c4ff5a,#74d400);color:#0c2400;border-color:#3d6b00}
body.bpm-editing .switches label.bpm-key:active{transform:translateY(1px)}
/* 入力中はBPM欄が押せることを分かりやすくする */
body.bpm-editing .bpm-panel{outline:2px solid #aaff00;outline-offset:1px}

/* --- 動画から音声を取り出す間の進捗 -------------------------------------
   波形の下の小さな文字では読み取れないので、画面の中央に大きく出す。
   scale-wrap の外に置き、縮小の影響を受けない大きさを保つ。          */
.vidprog{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.vidprog[hidden]{display:none}
.vidprog-box{text-align:center;padding:24px 30px;line-height:1.3}
.vidprog-box b{display:block;font:700 clamp(56px,20vw,120px)/1 monospace;color:#aaff00;
  letter-spacing:.02em;text-shadow:0 0 26px rgba(170,255,0,.55);font-variant-numeric:tabular-nums}
.vidprog-box span{display:block;margin-top:10px;font:700 11px/1.4 monospace;letter-spacing:.22em;color:#8fa87a}
.vidprog-box i{display:block;margin-top:14px;font:400 12px/1.5 sans-serif;font-style:normal;color:#7e7e7e}

.switches label.ex-flash{
  background:linear-gradient(#c4ff5a,#74d400);
  color:#0c2400;
  border-color:#3d6b00;
  box-shadow:0 0 20px rgba(150,255,40,.72),0 3px 0 #5f8f00,inset 0 1px 0 rgba(255,255,255,.5)}

/* --- PAN の文字表示を消す(機能は据え置き) --- */
.pan-title{display:none}

/* --- パン: ロータリーノブ ---------------------------------------------
   操作は今まで通り input[type=range] のまま(左右ドラッグ)で、
   見た目だけノブにする。外側の .pan-unit は99px固定のままなので
   周囲のレイアウトは動かない。
     目盛り  8時 / 12時 / 4時 の3点 (12時を挟んで左右120度ずつ)
     弧      12時起点。R方向は赤、L方向は青で振れた分を描く          */
/* 縦フレックスの主軸サイズは flex-basis が height より優先されるため、
   前段の flex:0 0 46px を打ち消しておかないと高さが46pxのまま潰れる。 */
.pan-knob{position:relative;display:block;flex:0 0 76px;width:76px;height:76px;margin:0 auto;border-radius:50%}
/* 目盛り。外周の帯にだけ見える(内側は本体の円が覆う) */
.pan-knob::before{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from -1.2deg,
    #d0d0d0 0 2.4deg, transparent 2.4deg 118.8deg,
    #d0d0d0 118.8deg 121.2deg, transparent 121.2deg 238.8deg,
    #d0d0d0 238.8deg 241.2deg, transparent 241.2deg 360deg)}
/* 振れ量の弧。半径27〜32pxの帯にだけ見える(内側は本体が覆う) */
.pk-arc{
  position:absolute;inset:6px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from var(--arc-from,0deg),
    var(--arc-color,transparent) 0 var(--arc-sweep,0deg),
    transparent var(--arc-sweep,0deg) 360deg)}
/* 黒い本体(半径27px)。中央を覆い、外側にリングだけ残す */
.pk-face{
  position:absolute;inset:11px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 28%,#3d3d3d 0%,#161616 46%,#050505 100%);
  box-shadow:0 2px 5px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.16)}
/* 指示線。本体の内側に収める(中心から8〜22px)。円の中心=上から38pxを軸に回す */
.pk-mark{
  position:absolute;left:50%;top:16px;width:3px;height:14px;margin-left:-1.5px;
  background:#ededed;border-radius:2px;pointer-events:none;
  transform-origin:50% 22px;transform:rotate(var(--ang,0deg))}
.pk-l,.pk-r{position:absolute;bottom:4px;font:900 10px/1 Arial,Helvetica,sans-serif;color:#9a9a9a;pointer-events:none}
.pk-l{left:1px}
.pk-r{right:1px}
/* 操作面。ノブ全体を覆う透明なrange */
.pan-knob .pan-slider{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:ew-resize}

/* --- REC: 16パッドと同じ作りで赤 ---------------------------------------
   これまで .rec-led は文字色しか指定がなく、背景は .bay button の黒が
   そのまま出ていた。パッド(.switches label)の消灯/点灯/無効の3状態を
   そっくり赤に置き換える。                                            */
.bay button.rec-led{
  background:linear-gradient(#6e1a1a,#431010);
  color:rgba(255,208,208,.78);
  border:1px solid #1c0404;
  box-shadow:0 3px 0 #7e7e7e,inset 0 1px 0 rgba(255,255,255,.10),inset 0 -6px 12px rgba(0,0,0,.35)}
.bay button.rec-led:disabled{
  background:linear-gradient(#3f1111,#260909);
  color:rgba(255,208,208,.24);
  box-shadow:0 3px 0 #8d8d8d,inset 0 -6px 12px rgba(0,0,0,.35)}
.bay button.rec-led.lit{
  background:linear-gradient(#ff5f5f,#d40000);
  color:#280000;border-color:#6b0000;
  box-shadow:0 0 20px rgba(255,45,45,.72),0 3px 0 #8f0000,inset 0 1px 0 rgba(255,255,255,.45)}

/* --- テンポスライダー: 中央(1.0×)起点のゲージ --------------------------
   accent-color は下端から溜まる作りで、1.0×が中央にあるこのスライダーには
   合わない。トラックを自前で描き、1.0×から動かした向きと量だけ色を付ける。 */
.speed-slider{-webkit-appearance:none;appearance:none;background:transparent}
.speed-slider::-webkit-slider-runnable-track{
  border-radius:5px;background:linear-gradient(to top,
    #141414 0%,#141414 var(--gauge-lo,50%),
    #aaff00 var(--gauge-lo,50%),#aaff00 var(--gauge-hi,50%),
    #141414 var(--gauge-hi,50%),#141414 100%);
  box-shadow:inset 0 0 0 1px #000}
.speed-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#aaff00;border:1px solid #4d7300;box-shadow:0 0 8px rgba(170,255,0,.7)}
.speed-slider::-moz-range-track{
  border-radius:5px;background:linear-gradient(to top,
    #141414 0%,#141414 var(--gauge-lo,50%),
    #aaff00 var(--gauge-lo,50%),#aaff00 var(--gauge-hi,50%),
    #141414 var(--gauge-hi,50%),#141414 100%)}
.speed-slider::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;border:1px solid #4d7300;
  background:#aaff00;box-shadow:0 0 8px rgba(170,255,0,.7)}

</style>
</head>
<body>
<div class="window"><div class="scale-wrap" id="scaleWrap"><div class="titlebar"><div class="closebox"></div><div class="title">ROBOLINGUAL</div><div class="version">v1.0</div></div><main>
<div id="deckSkin" aria-hidden="true"></div>
<input id="source" type="file" accept="audio/*,video/*,.wav,.mp3,.m4a,.aac,.mp4,.m4v,.mov,.qt">

<div class="deck-row deck-player">
  <div class="bay bay-side">
    <button id="performancePlay" class="play-led" type="button" disabled>▶︎ PLAY</button>
    <button id="performanceStop" type="button">■︎ STOP</button>
    <button id="performanceRec" class="rec-led" type="button" disabled>●︎ REC</button>
    <button id="downloadAll" class="dl-wav" type="button" disabled>SAVE</button>
  </div>
  <div class="bay bay-main">

function getAudioContext(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();return audioContext}
async function loadSoundLogo(){
  if(soundLogoBuffer)return soundLogoBuffer;
  const ctx=getAudioContext();
  const response=await fetch(SOUND_LOGO_DATA);
  const data=await response.arrayBuffer();
  soundLogoBuffer=await ctx.decodeAudioData(data.slice(0));
  return soundLogoBuffer;
}
async function playSoundLogoOneShot(){
  try{
    const ctx=getAudioContext();
    if(ctx.state==="suspended")await ctx.resume();
    const buffer=await loadSoundLogo();
    const source=ctx.createBufferSource();
    const gain=ctx.createGain();
    gain.gain.value=.9;
    source.buffer=buffer;
    source.connect(gain);
    gain.connect(ctx.destination);
    source.start();
  }catch(error){console.warn("Sound logo playback failed",error)}
}
function buildSoundLogoTrack(total,sr,bpm,bars){
  if(!soundLogoBuffer)return null;
  const out=getAudioContext().createBuffer(1,total,sr);
  const dest=out.getChannelData(0);
  const beat=sr*60/bpm;
  const start=Math.floor(((bars-1)*4+2)*beat); // 最終小節の3拍目(小節数に追従)
  const channels=soundLogoBuffer.numberOfChannels;
  const ratio=soundLogoBuffer.sampleRate/sr;
  const available=Math.max(0,total-start);
  const frames=Math.min(available,Math.floor(soundLogoBuffer.length/ratio));
  for(let i=0;i<frames;i++){
    const pos=i*ratio,p0=Math.floor(pos),p1=Math.min(soundLogoBuffer.length-1,p0+1),frac=pos-p0;
    let sample=0;
    for(let ch=0;ch<channels;ch++){
      const d=soundLogoBuffer.getChannelData(ch);
      sample+=(d[p0]*(1-frac)+d[p1]*frac)/channels;
    }
    dest[start+i]=sample;
  }
  // 埋め込みMP3の音量差を吸収し、サウンドロゴを常に前へ出す。
  let peak=0;
  for(let i=start;i<start+frames;i++)peak=Math.max(peak,Math.abs(dest[i]));
  if(peak>1e-7){
    const scale=.98/peak;
    for(let i=start;i<start+frames;i++)dest[i]*=scale;
  }
  return out;

function isVideoFile(file){
  const type=(file.type||"").toLowerCase();
  const name=(file.name||"").toLowerCase();
  if(type.startsWith("video/"))return true;
  if(type.startsWith("audio/"))return false;
  if(/\.(mp4|m4v|mov|qt|webm|3gp|3g2|avi|mkv)$/i.test(name))return true;
  if(/\.(wav|mp3|m4a|aac|flac|ogg|oga|opus|aif|aiff)$/i.test(name))return false;
  // iPhoneの「写真」経由では MIME や拡張子が空になる場合がある。
  // 不明なメディアは、止まり続ける decodeAudioData へ送らず動画経路に倒す。
  return true;
}

async function decodeSourceFile(ctx,file,isVideo){
  if(!isVideo){
    const data=await file.arrayBuffer();
    return await ctx.decodeAudioData(data.slice(0));
  }

  // 動画コンテナをdecodeAudioDataへ渡すと、iPhone Safariでは
  // 失敗せずPromiseが止まり続ける場合がある。
  // 動画は形式・容量を問わず、必ず明示タップの再生経由で抽出する。
  return await extractVideoAudioByPlayback(ctx,file);
}

async function extractVideoAudioByPlayback(ctx,file){
  const url=URL.createObjectURL(file);
  objectURLs.push(url);

  const video=document.createElement("video");
  video.preload="metadata";
  video.playsInline=true;
  video.setAttribute("playsinline","");
  video.setAttribute("webkit-playsinline","");
  video.src=url;
  video.volume=1;
  video.muted=false;
  video.controls=false;
  video.disablePictureInPicture=true;
  // iOS Safariは画面外・極小・完全透明なvideoの読み込みを止めることがある。
  // そのため読み込み中だけ、実体のある小さなプレビューとして置く。
  video.className="wave-video-preview";
  waveBox.appendChild(video);

  let actionButton=null;
  const removeUI=()=>{
    pendingVideoStart=null;
    actionButton=null;
  };
  const removeVideo=()=>{
    removeUI();
    try{video.pause()}catch(_){}
    video.removeAttribute("src");
    try{video.load()}catch(_){}
    if(video.parentNode)video.parentNode.removeChild(video);
  };

  // 写真アプリから選んだ動画は、選択直後のユーザー操作権限がここまで残らないことがある。
  // 自動再生に賭けず、最初から明示的な1タップで開始する。
  setStatus("Video selected — tap READ VIDEO");
  actionButton=mainAction;
  setMainAction("read","READ VIDEO");
  // Safariにボタンを先に描画させる。Web Audioの準備はその次に行う。
  await new Promise(resolve=>requestAnimationFrame(()=>resolve()));

  let mediaSource,processor,silentGain;
  try{
    mediaSource=ctx.createMediaElementSource(video);
    processor=ctx.createScriptProcessor(4096,2,1);
    silentGain=ctx.createGain();
    silentGain.gain.value=.00001;
  }catch(error){
    removeVideo();
    throw error;
  }

  const monoChunks=[];
  let capturedFrames=0,finished=false,videoDuration=0;

  mediaSource.connect(processor);
  processor.connect(silentGain);
  silentGain.connect(ctx.destination);

  processor.onaudioprocess=event=>{
    if(finished)return;
    const input=event.inputBuffer;
    const frames=input.length;
    const channels=Math.max(1,input.numberOfChannels);
    const chunk=new Float32Array(frames);
    for(let ch=0;ch<channels;ch++){
      const data=input.getChannelData(ch);
      for(let i=0;i<frames;i++)chunk[i]+=data[i]/channels;
    }
    monoChunks.push(chunk);
    capturedFrames+=frames;
  };

  await new Promise((resolve,reject)=>{
    let done=false;
    let timeout=null;
    const cleanup=()=>{
      if(timeout)clearTimeout(timeout);
      video.removeEventListener("ended",onEnded);
      video.removeEventListener("error",onError);
      video.removeEventListener("timeupdate",onProgress);
      pendingVideoStart=null;
    };
    const finish=error=>{
      if(done)return;
      done=true;finished=true;
      cleanup();
      processor.onaudioprocess=null;
      try{mediaSource.disconnect()}catch(_){}
      try{processor.disconnect()}catch(_){}
      try{silentGain.disconnect()}catch(_){}
      removeVideo();
      hideVideoProgress();
      error?reject(error):resolve();
    };
    const onEnded=()=>finish();
    const onError=()=>finish(new Error("Safari could not open or play this video."));
    const onProgress=()=>{
      if(!videoDuration&&Number.isFinite(video.duration))videoDuration=video.duration;
      const pct=videoDuration>0?Math.min(99,Math.max(0,Math.round(video.currentTime/videoDuration*100))):0;
      setStatus(`Reading video audio... ${pct}% — keep Safari open`);
      showVideoProgress(pct);
    };
    const onStart=async()=>{
      setMainAction("busy","STARTING...",true);
      try{
        if(ctx.state==="suspended")await ctx.resume();
        video.currentTime=0;
        video.load();
        setStatus("Opening video...");
        await video.play();
        removeUI();
        if(Number.isFinite(video.duration)&&video.duration>0)videoDuration=video.duration;
        timeout=setTimeout(()=>finish(new Error("Video audio extraction timed out.")),Math.max(60000,((videoDuration||30)+45)*1000));
      }catch(error){
        finish(new Error("Safari could not start the selected video."));
      }
    };

    video.addEventListener("ended",onEnded,{once:true});
    video.addEventListener("error",onError,{once:true});
    video.addEventListener("timeupdate",onProgress);
    pendingVideoStart=onStart;
  });

  if(capturedFrames<1)throw new Error("No audio track was found in this video.");

  const duration=videoDuration>0?videoDuration:capturedFrames/ctx.sampleRate;
  const expectedFrames=Math.ceil(duration*ctx.sampleRate);
  const outputFrames=Math.min(capturedFrames,expectedFrames+4096);
  const out=ctx.createBuffer(1,outputFrames,ctx.sampleRate);
  const target=out.getChannelData(0);
  let offset=0;
  for(const chunk of monoChunks){
    if(offset>=outputFrames)break;
    const count=Math.min(chunk.length,outputFrames-offset);
    target.set(chunk.subarray(0,count),offset);
    offset+=count;
  }
  return out;
}

function flashPadOnce(id,durationMs,cancelToken){
  const label=document.querySelector(`label[for="${id}"]`);
  if(!label)return;
  setPadGlow(label,true);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(cancelToken&&cancelToken.cancelled)return;

function scheduleIntroAnimation(bpm){
  // TRANSLATE押下（サウンドロゴ再生）と同時に走る、170BPMで2拍分のパッド点灯演出。
  const beatMs=60000/bpm;
  const order=["ninjaA","ninjaB","ninjaC","ninjaD","killerD","bankerD","witchD","witchC","witchB","witchA","bankerA","killerA","killerB","killerC","bankerC","bankerB"];
  const onDur=beatMs/20,stepDur=beatMs/16;
  const labels=order.map(id=>document.querySelector(`label[for="${id}"]`)).filter(Boolean);
  // 1拍目の消灯処理が2拍目の全灯を巻き戻してしまわないよう、2拍目開始と同時に無効化する。
  const cancelToken={cancelled:false};
  // 1拍目：渦を巻くように16個を順番に点灯→フェード消灯（1/16拍間隔×16=ちょうど1拍）。
  order.forEach((id,i)=>{setTimeout(()=>flashPadOnce(id,onDur,cancelToken),i*stepDur)});
  // 2拍目：16個同時に点灯→0.5拍保持→0.375拍かけてフェードアウト→残り0.125拍は消灯を維持。
  const beat2Start=beatMs;
  setTimeout(()=>{
    cancelToken.cancelled=true;
    labels.forEach(label=>setPadGlow(label,true));
  },beat2Start);
  setTimeout(()=>{labels.forEach(label=>fadePadGlow(label,beatMs*.375))},beat2Start+beatMs*.5);
  setTimeout(()=>{labels.forEach(label=>clearPadGlow(label))},beat2Start+beatMs);
}

function toAudioBuffer(samples,sr){
  const ctx=getAudioContext();
  const buffer=ctx.createBuffer(1,samples.length,sr);

function crc32(bytes){
  let crc=-1;
  for(let i=0;i<bytes.length;i++){
    crc^=bytes[i];
    for(let k=0;k<8;k++)crc=(crc>>>1)^((crc&1)?0xEDB88320:0);
  }
  return (crc^(-1))>>>0;
}
function u16(v){return new Uint8Array([v&255,(v>>>8)&255])}
function u32(v){return new Uint8Array([v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255])}

async function makeStoredZip(entries){
  const enc=new TextEncoder(),locals=[],centrals=[];let offset=0;
  for(const entry of entries){
    const name=enc.encode(entry.name),data=new Uint8Array(await entry.blob.arrayBuffer()),crc=crc32(data);
    const local=concatBytes([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);
    locals.push(local);
    const central=concatBytes([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);
    centrals.push(central);offset+=local.length;
  }
  const centralBytes=concatBytes(centrals),localBytes=concatBytes(locals);
  const end=concatBytes([u32(0x06054b50),u16(0),u16(0),u16(entries.length),u16(entries.length),u32(centralBytes.length),u32(localBytes.length),u16(0)]);
  return new Blob([localBytes,centralBytes,end],{type:"application/zip"});
}

async function saveBlob(blob,fileName){
  let file=null;
  try{file=new File([blob],fileName,{type:blob.type||"application/octet-stream"})}catch(_){file=null}
  try{
    if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fileName});
      return true;
    }
  }catch(error){
    if(error&&error.name==="AbortError")return false;
    console.warn("Share save failed; falling back to download.",error);
  }
  const url=URL.createObjectURL(blob);
  objectURLs.push(url);
  const a=document.createElement("a");
  a.href=url;
  a.download=fileName;
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>{try{URL.revokeObjectURL(url)}catch(_){ }},30000);
  return true;
}

function drawRecordedWave(progress=0){
  if(!recordedBuffer)return;
  const ctx=resizeCanvas(wave),width=wave.width,height=wave.height,data=recordedBuffer.getChannelData(0),step=Math.max(1,Math.floor(data.length/width));drawGrid(ctx,width,height);
  let peak=0;for(let i=0;i<data.length;i+=Math.max(1,Math.floor(data.length/12000)))peak=Math.max(peak,Math.abs(data[i]));const gain=peak>1e-6?Math.min(20,.9/peak):1;
  ctx.strokeStyle="#aaff00";ctx.lineWidth=Math.max(1.4,(devicePixelRatio||1)*1.25);ctx.beginPath();for(let x=0;x<width;x++){let min=1,max=-1;for(let i=x*step;i<Math.min(data.length,(x+1)*step);i++){const v=Math.max(-1,Math.min(1,data[i]*gain));min=Math.min(min,v);max=Math.max(max,v)}ctx.moveTo(x,(1+min)*.5*height);ctx.lineTo(x,(1+max)*.5*height)}ctx.stroke();
  if(progress>0){const x=Math.max(0,Math.min(width,width*progress));ctx.strokeStyle="#fff";ctx.lineWidth=Math.max(2,devicePixelRatio||1);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke()}
}
function seekRecordedFromPointer(event){

  const wasPlaying=!!performanceSource;if(wasPlaying){stopRecordedPlayback(false,false);playRecordedPerformance()}else drawRecordedWave(performanceOffset/recordedBuffer.duration);
}

// --- スリップループ(全体エフェクト) -------------------------------------------------
// 波形画面を触ってる間、聴こえる音だけをビートリピートさせる。タイムライン自体は止めずに
// 進み続け、離したら「進み続けていた現在地」からそのまま普通に再生再開する(=スリップ)。
// 実装は、ライブの出音をリング状に録り貯めているcaptureBuffer(カオスパッドと共用)から、
// 直近の一定区間をループ再生しつつ、通常のミキサー出力を一時的にミュートするだけ。
// ミキサー本体(mixerSources)は一切止めていないので、ミュートを解けば時間経過そのまま。
let waveSlipPointerId=null,slipActive=false,slipSource=null,slipCurrentFraction=null;
// スリップ開始の瞬間に切り取った音の写し。以降の刻み変更はこれを切り直すだけで、
// リングバッファを読み直さない。
// 理由: 開始と同時にmixerMasterをミュートする＝chaosBus経由のキャプチャには
// 無音しか流れ込まなくなるため、capturePosを都度読むと無音を掴んでしまう。
// またリングから直線バッファへ写しておけば、折り返し位置をまたぐ心配もなくなる。
let slipSnapshot=null;
// 写しの末尾が、8小節ループの中のどの位置(秒)にあたるか。-1は不明で吸着しない。
let slipSnapshotElapsed=-1;
// キャプチャ経路には遅れがあり、写しの末尾は「今」より少し前を指す。
// その差をここで補正する。プラスにすると吸着位置が前へ、マイナスで後ろへ動く。
// 実測できない値なので、耳で合わせて調整する前提の数値。
const SLIP_ALIGN_OFFSET_MS=0;
// 波形上でサンプリング箇所を光らせるための控え。
// slipBandEnd/Dur はループ内の秒、slipLoopAnchor は今の周回が始まった時刻。
let slipBandEnd=-1,slipBandDur=0,slipLoopAnchor=0;
// 押すたびに作り直す4拍ぶんの素材と、その頭がループ内のどこ(秒)か。
let slipSample=null,slipSampleElapsed=-1,slipBarSec=2;
const SLIP_ZONES=[[1,1/32,1/16],[1/2,1/4,1/8]]; // 上段/下段 × 左/中/右(手描き案の配置通り)
function waveZoneFraction(clientX,clientY){
  const rect=wave.getBoundingClientRect();
  if(!rect.width||!rect.height)return 1;
  const col=Math.min(2,Math.max(0,Math.floor((clientX-rect.left)/rect.width*3)));
  const row=Math.min(1,Math.max(0,Math.floor((clientY-rect.top)/rect.height*2)));
  return SLIP_ZONES[row][col];
}
// スリップ開始時点までに録れている音を、リングから直線バッファへ写し取る。
// 末尾が「触った瞬間の音」になるよう新しい順に詰めるので、
// 以降はこのバッファの末尾から欲しい長さだけ遡れば刻みが作れる。
function slipTakeSnapshot(){
  const ctx=getAudioContext();
  if(!captureData||!captureLen)return null;
  const guard=Math.floor(.03*ctx.sampleRate); // 書き込み位置の直前は避ける
  const len=captureLen-guard-1;
  if(len<=2)return null;
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const out=buf.getChannelData(0);
  const end=((capturePos-guard)%captureLen+captureLen)%captureLen;
  for(let i=0;i<len;i++){
    out[len-1-i]=captureData[((end-1-i)%captureLen+captureLen)%captureLen];
  }
  return buf;
}
// 押した位置から4拍(1小節)ぶんを切り出し、これを固定の素材にする。
// 刻みは「この素材の頭から何ぶん鳴らすか」を決めるだけなので、刻みを変えても
// 音の出頭が動かない。以前は終端を区切りに合わせて後ろへ伸ばしていたため、
// 刻みを粗くするほど古い音へ遡っていた。
// 取るのは直前の小節線から1小節ぶん。録り貯めが届かない範囲は無音のままにする。
function slipBuildSample(){
  const ctx=getAudioContext(),sr=ctx.sampleRate;
  if(!slipSnapshot)return false;
  const bpm=Math.max(1,(renderedBpm||Number(bpmInput.value)||120)*masterRate);
  slipBarSec=60/bpm*4;
  const snapLenSec=slipSnapshot.length/sr;
  // 写しの末尾が slipSnapshotElapsed にあたる。そこから逆算して読み出し位置を出す。
  let bandStart=-1,readStart=snapLenSec-slipBarSec;
  if(slipSnapshotElapsed>=0){
    // 押した時点から遡って4拍ぶん。終わりは直前の拍に合わせるので、
    // 出頭も拍の上に乗り、キックなどの頭がループの先頭に来る。
    const beatSec=slipBarSec/4;
    const end=Math.floor(slipSnapshotElapsed/beatSec)*beatSec;       // 直前の拍
    const startElapsed=end-slipBarSec;                               // そこから過去4拍
    readStart=snapLenSec-(slipSnapshotElapsed-startElapsed);
    // ループの頭の近くで押すと出頭がマイナス秒(前の周回の終わり)になる。
    // 読み出しはそのままでよいが、帯の位置はループ内へ畳んでおかないと
    // 負の値になり、描画が止まってしまう。
    const loopDur=mixerLoopDuration||0;
    bandStart=loopDur>0?((startElapsed%loopDur)+loopDur)%loopDur:startElapsed;
  }
  const len=Math.max(2,Math.round(slipBarSec*sr));
  const out=ctx.createBuffer(1,len,sr);
  const dst=out.getChannelData(0),srcData=slipSnapshot.getChannelData(0);
  const base=Math.round(readStart*sr);
  for(let i=0;i<len;i++){
    const j=base+i;
    dst[i]=(j>=0&&j<srcData.length)?srcData[j]:0; // 録り貯めの外は無音で埋める
  }
  slipSample=out;
  slipSampleElapsed=bandStart;
  return true;
}
function slipPlayWindow(fraction){
  const ctx=getAudioContext();
  if(!slipSample)return null;
  // 常に素材の頭から鳴らす。刻みは終わりの位置だけを決める。
  const durSec=Math.max(.015,Math.min(slipBarSec,slipBarSec*fraction));
  const src=ctx.createBufferSource();
  src.buffer=slipSample;
  src.loop=true;
  src.loopStart=0;
  src.loopEnd=durSec;
  const gain=ctx.createGain();gain.gain.value=1;
  src.connect(gain).connect(getChaosOut());
  const t0=ctx.currentTime;
  src.start(t0,0);
  slipBandEnd=slipSampleElapsed>=0?slipSampleElapsed+durSec:-1;
  slipBandDur=durSec;
  slipLoopAnchor=t0;
  return{src,gain};
}
function slipStart(fraction){
  if(slipActive||!mixerRunning)return;
  getChaosBus(); // captureBufferを確実に用意しておく
  if(!captureBuffer)return;
  slipSnapshot=slipTakeSnapshot(); // ミュートする前に、生きている音を写し取る
  if(!slipSnapshot)return;
  // 写しの末尾がループ内のどこにあたるかを控える。刻みごとの吸着量はこれから出す。
  {
    const ac=getAudioContext(),loopDur=mixerLoopDuration||0;
    if(loopDur>0){
      const t=ac.currentTime-SLIP_ALIGN_OFFSET_MS/1000;
      slipSnapshotElapsed=((t-mixerLoopStartTime)%loopDur+loopDur)%loopDur;
    }else slipSnapshotElapsed=-1;
  }
  if(!slipBuildSample())return;
  slipActive=true;
  slipCurrentFraction=fraction;
  const ctx=getAudioContext(),t=ctx.currentTime;
  mixerMaster.gain.cancelScheduledValues(t);
  mixerMaster.gain.setValueAtTime(mixerMaster.gain.value,t);
  mixerMaster.gain.linearRampToValueAtTime(0,t+.006); // 元の音を一瞬でミュート(タイムラインは止めない)
  slipSource=slipPlayWindow(fraction);
}
function slipRetrigger(fraction){
  if(!slipActive||fraction===slipCurrentFraction||!slipSource)return;
  slipCurrentFraction=fraction;
  const ctx=getAudioContext();
  const durSec=Math.max(.015,Math.min(slipBarSec,slipBarSec*fraction));
  // 音源は作り直さず、ループの終わりだけ動かす。
  // 作り直すと刻みを変えるたびに頭から鳴り直すので、細かく動かしたときに
  // いちいち引っかかって聞こえていた。終わりを動かすだけなら次の折り返しから
  // 効くので、鳴りが途切れない。出頭(loopStart=0)は動かないままになる。
  slipSource.src.loopEnd=durSec;
  // 今の再生位置が新しい終わりより後ろなら、すぐ折り返す。
  // 光らせる周期の基準も、その折り返しに合わせておく。
  if(ctx.currentTime-slipLoopAnchor>=durSec)slipLoopAnchor=ctx.currentTime;
  slipBandDur=durSec;
  slipBandEnd=slipSampleElapsed>=0?slipSampleElapsed+durSec:-1;
}
function slipStop(){
  if(!slipActive)return;
  slipActive=false;slipCurrentFraction=null;slipSnapshot=null;slipSnapshotElapsed=-1;
  slipBandEnd=-1;slipBandDur=0;slipSample=null;slipSampleElapsed=-1;
  const ctx=getAudioContext(),t=ctx.currentTime;
  if(slipSource){
    const{src,gain}=slipSource;slipSource=null;
    gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(gain.gain.value,t);gain.gain.linearRampToValueAtTime(0,t+.008);
    try{src.stop(t+.02)}catch(_){}
    setTimeout(()=>{try{src.disconnect()}catch(_){}try{gain.disconnect()}catch(_){}},200);
  }
  if(mixerMaster){
    mixerMaster.gain.cancelScheduledValues(t);
    mixerMaster.gain.setValueAtTime(mixerMaster.gain.value,t);
    mixerMaster.gain.linearRampToValueAtTime(1,t+.008); // ミュート解除。進み続けていた現在地からそのまま再開
  }
}
async function startMixer(){
  if(mixerRunning)return;
  const ctx=getAudioContext();
  if(ctx.state==="suspended")await ctx.resume();
  const when=ctx.currentTime+.04;
  mixerSources=[];
  mixerGains={};
  mixerLoopStartTime=when;
  mixerLoopDuration=0;
  for(const mode of["ninja","killer","banker","witch"]){
    for(const variant of["a","b","c"]){
      const buffer=rendered[mode][variant];
      if(!buffer)continue;
      if(!mixerLoopDuration)mixerLoopDuration=buffer.duration; // 全variant共通の長さ(8小節)
      const source=ctx.createBufferSource();
      const gain=ctx.createGain();
      source.buffer=buffer;
      source.loop=true;
      source.loopStart=0;
      source.loopEnd=buffer.duration;
      source.playbackRate.setValueAtTime(masterRate,when);
      gain.gain.setValueAtTime(0,when);
      source.connect(gain).connect(getModePanner(mode));
      source.start(when);
      mixerSources.push(source);
      mixerGains[`${mode}-${variant}`]=gain;
    }
  }
  if(renderedSoundLogo){
    const logoSource=ctx.createBufferSource();
    const logoGain=ctx.createGain();
    logoSource.buffer=renderedSoundLogo;
    logoSource.loop=true;
    logoSource.loopStart=0;
    logoSource.loopEnd=renderedSoundLogo.duration;
    logoSource.playbackRate.setValueAtTime(masterRate,when);
    logoGain.gain.setValueAtTime(1,when);
    logoSource.connect(logoGain).connect(getMixerMaster());
    logoSource.start(when);
    mixerSources.push(logoSource);
    mixerGains.soundLogo=logoGain;
  }
  mixerRunning=true;
  document.getElementById("hardRestart").disabled=false;
  startMixerGrid();
}

function updateMixer(){
  const anyOn=["ninja","killer","banker","witch"].some(mode=>{
    const selected=document.querySelector(`input[name="${mode}"]:checked`);
    return !!selected;
  });
  if(anyOn&&!mixerRunning){
    startMixer().then(applyMixerGains);
  }else{
    applyMixerGains();
  }
}

function sliderToRate(value){
  const v=Number(value)/1000;return Math.pow(3,-v);
}

function setMasterRate(rate){
  masterRate=clamp(rate,1/3,3);
  const now=getAudioContext().currentTime;
  for(const source of mixerSources){
    try{
      source.playbackRate.cancelScheduledValues(now);
      source.playbackRate.setTargetAtTime(masterRate,now,.012);
    }catch(_){}
  }
  speedValue.textContent=`${masterRate.toFixed(2)}×`;
  updateEffectiveBpm();
}

function resetMasterRate(){
  speedSlider.value="0";
  setMasterRate(1);
  updateSpeedGauge(); // 値を直接書き換えたときはinputが飛ばないので、自分で描き直す
}

function applyMixerGains(){
  if(!mixerRunning)return;
  const ctx=getAudioContext();
  const now=ctx.currentTime;
  let anyOn=false;
  for(const mode of["ninja","killer","banker","witch"]){
    const selected=document.querySelector(`input[name="${mode}"]:checked`);
    const value=selected?selected.value:null;
    if(value)anyOn=true;
    for(const variant of["a","b","c"]){
      const gain=mixerGains[`${mode}-${variant}`];
      if(!gain)continue;
      const target=value===variant?1:0;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setTargetAtTime(target,now,.008);
    }
  }
  const logoGain=mixerGains.soundLogo;
  if(logoGain){
    logoGain.gain.cancelScheduledValues(now);
    logoGain.gain.setTargetAtTime(anyOn?1:0,now,.008);
  }
}

const activeDVoices={};
const lastExTrigger={ninja:-Infinity,killer:-Infinity,banker:-Infinity,witch:-Infinity}; // 波形グリッドのフラッシュ表示用
// Exの鳴り方。他の音に埋もれないよう、音量と音程をここで調整する。
const EX_GAIN=1.3;                            // 1.0が元の音量
const EX_SEMITONES=4;                         // 音階を半音いくつ上げるか(4=2音)
const EX_PITCH_RATE=Math.pow(2,EX_SEMITONES/12);
function triggerOneShotD(mode){
  // Dは4系統ループの仕組みから完全に独立：押した瞬間に単発で再生する（他の再生状況とは無関係）。
  // Dのバッファは常に「中身ぴったり1小節(4拍)」の長さで生成されているので、
  // バッファ全体をそのまま再生すればよく、途中でカットする特別な計算は不要。
  const buffer=rendered[mode]&&rendered[mode].d;
  if(!buffer)return;
  lastExTrigger[mode]=performance.now();
  flashEx(mode);
  const ctx=getAudioContext();
  if(ctx.state==="suspended")ctx.resume();
  // 連打で同じDが再度押された場合、前の再生を即座に(クリックが出ない範囲で最速に)打ち切って
  // 頭から再スタートする。これにより「最初のアタックだけをダダダダ連打する」奏法が可能になる。
  const prev=activeDVoices[mode];
  if(prev){
    try{
      const t=ctx.currentTime;
      prev.gain.gain.cancelScheduledValues(t);
      prev.gain.gain.setValueAtTime(prev.gain.gain.value,t);
      prev.gain.gain.linearRampToValueAtTime(0,t+.006);
      prev.source.stop(t+.008);
    }catch(_){}
  }
  const source=ctx.createBufferSource();
  const gain=ctx.createGain();
  source.buffer=buffer;
  source.loop=false;
  // Exは他の音に埋もれやすいので、少し持ち上げて音程も上げる。
  // 再生速度で音程を変えているため、上げたぶんだけ発音は短くなる。
  source.playbackRate.setValueAtTime(masterRate*EX_PITCH_RATE,ctx.currentTime);
  gain.gain.setValueAtTime(EX_GAIN,ctx.currentTime);
  source.connect(gain).connect(getModePanner(mode));
  activeDVoices[mode]={source,gain};
  const rate=Math.max(.05,masterRate);
  const realSeconds=buffer.duration/rate;
  source.start(ctx.currentTime);
  source.onended=()=>{
    try{source.disconnect()}catch(_){}
    try{gain.disconnect()}catch(_){}
    if(activeDVoices[mode]&&activeDVoices[mode].source===source)delete activeDVoices[mode];
  };
  void realSeconds;
}
// Exは押しっぱなしの状態ではなく単発のトリガーなので、点灯させて残さず一瞬光らせる。
const EX_FLASH_MS=110;
function flashEx(mode){
  const label=document.querySelector(`label[for="${mode}D"]`);
  if(!label)return;
  label.classList.remove("ex-flash");
  void label.offsetWidth; // 連打でも毎回頭から光らせるため、一度リセットして再適用する
  label.classList.add("ex-flash");
  clearTimeout(label._exFlashTimer);
  label._exFlashTimer=setTimeout(()=>label.classList.remove("ex-flash"),EX_FLASH_MS);
}
// パッドの押下処理は padPress にまとめてある(下方)。

function stopMixer(reset=false){
  for(const source of mixerSources){
    try{source.stop()}catch(_){}
    try{source.disconnect()}catch(_){}
  }

// --- 入力欄にフォーカスしたときの自動拡大よけ ---------------------------
// 画面は scale-wrap で 720px の中身を縮めて収めているため、CSS上19pxの
// BPM欄も実寸では10px程度にしかならない。iOS も Chrome も「読める大きさ」
// まで勝手に拡大して、そこへ画面を寄せてしまう。
// 拡大を禁じる指定は触る直前だけ入れ、離れたら外す。入れっぱなしにすると
// 何かの拍子に拡大されたときピンチで戻せなくなる。
(function suppressFocusZoom(){
  const vp=document.querySelector('meta[name="viewport"]');
  if(!vp)return;
  const FREE="width=device-width,initial-scale=1,viewport-fit=cover";
  const LOCK="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover";
  const FIELDS="input[type=number],input[type=text],textarea";
  let timer=0;
  const editing=()=>{
    const a=document.activeElement;
    return !!(a&&a.matches&&a.matches(FIELDS));
  };
  // キーボードが開くと表示領域が縮み、その間だけページがスクロールできる
  // 状態になる。iOS はそこで入力欄を見せようと上へ送り、閉じたあとも戻し
  // 損ねる。入力中に送られるのは構わないが、終えたら元の位置に戻す。
  const resetScroll=()=>{
    window.scrollTo(0,0);
    const se=document.scrollingElement;if(se)se.scrollTop=0;
    if(document.body)document.body.scrollTop=0;
  };
  // 1回だけでは戻らない。閉じるアニメーションの途中で戻しても、そのあと
  // iOS が位置を入れ直してしまうため、閉じ切るまで何度か戻す。
  let resetTimers=[];
  const resetScrollHard=()=>{
    resetTimers.forEach(clearTimeout);
    resetTimers=[0,100,250,450,700,1000,1400].map(ms=>setTimeout(()=>{
      if(!editing())resetScroll();
    },ms));
  };
  const free=()=>{if(!editing()){vp.content=FREE;resetScrollHard()}};
  // キーボードが閉じた瞬間も拾う。focusout だけだと取りこぼすことがある。
  if(window.visualViewport){
    const vv=window.visualViewport;
    vv.addEventListener("resize",()=>{if(!editing())resetScrollHard()});
    vv.addEventListener("scroll",()=>{if(!editing())resetScroll()});
  }

  document.addEventListener("pointerdown",e=>{
    if(!(e.target instanceof Element)||!e.target.closest(FIELDS))return;
    clearTimeout(timer);
    vp.content=LOCK;
    timer=setTimeout(free,1200); // 結局フォーカスしなかった場合の戻し
  },true);
  document.addEventListener("focusout",()=>{
    clearTimeout(timer);
    timer=setTimeout(free,400);  // 戻すのはキーボードが閉じてから

})();

(function bpmPadKeypad(){

  const FN={BS:1,LEFT:1,RIGHT:1,CXL:1};   // 数字ではないキー(色を落とす)

  };

    if(on)return;

      const k=KEYS[y][x];

      lab.textContent=FACE[k]||k;

    if(fresh&&k!=="BS"){buf="";caret=0}

    if(k==="BS"){if(caret>0){buf=buf.slice(0,caret-1)+buf.slice(caret);caret--}}

  document.addEventListener("pointerdown",e=>{
    if(!on)return;
    const lab=e.target instanceof Element?e.target.closest(".switches label"):null;
    if(!lab)return;
    e.preventDefault();e.stopPropagation();
    for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(rows[y][x]===lab)press(KEYS[y][x]);

  bpmLabel.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="touch")return; // マウスは今までどおり直接入力できる
    e.preventDefault();                // フォーカスさせない＝キーボードが出ない
    swallowClick=true;

  });

  // フォーカスされてキーボードが開いてしまう。その分もここで断つ。
  bpmLabel.addEventListener("click",e=>{
    if(!swallowClick)return;
    swallowClick=false;e.preventDefault();
    bpmInput.blur();
  });
})();

function fitScaleWrapInner(){
  if(isTypingInInput())return;
  // 中身は固定pxの基準サイズのまま組み、scale-wrap全体をinnerWidth/innerHeightに収まるよう
  // 一括でズームする（screen.heightは埋め込みプレビュー環境で実際の表示枠と食い違うため使わない）。
  const wrap=document.getElementById("scaleWrap");
  if(!wrap)return;
  wrap.style.transform="none";
  wrap.style.marginBottom="";wrap.style.marginRight=""; // 前回の詰め分を戻してから実寸を測る
  const nativeW=wrap.offsetWidth,nativeH=wrap.offsetHeight;
  if(!nativeW||!nativeH)return;
  // bodyの余白は0にしたので、引くのは .window の枠線(左右/上下 2pxずつ)だけ。
  // ここを引かないと拡大後の幅が画面をわずかに超えて横スクロールが出る。
  //
  // innerWidth/innerHeight は使わないこと。iOS Safari ではピンチやフォーカス
  // 拡大の状態が反映され、ソフトキーボードでも変わる。一度ズームすると
  // 縮んだ幅を読んで小さく描き、その結果が次の測定にも残るため、
  // リロードしても小さいままという抜け出せない状態になる。
  // documentElement.clientWidth/Height はレイアウトビューポートで、
  // ズームにもキーボードにも動かされない。
  const doc=document.documentElement;
  const availW=doc.clientWidth-4,availH=doc.clientHeight-4;
  const scale=Math.min(1,availW/nativeW,availH/nativeH);
  wrap.style.transform=`scale(${scale})`;
  // transformは見た目を縮めるだけで、レイアウト上の箱は元寸(720px)のまま残る。
  // 詰めないと親(.window)が常に724px幅のままになり、狭い画面では箱が左右に
  // はみ出す(390px幅で -167〜557)。基点を左上にしてあるので、
  // 右と下の負マージンで箱を見た目の大きさちょうどまで縮められる。
  // 左マージンは使わないこと。負にすると箱が縮むのではなく要素自体が左へずれる。
  wrap.style.marginRight=`${-nativeW*(1-scale)}px`;

    const vGain=ctx.createGain();vGain.gain.value=1/voices;
    input.connect(delay).connect(vGain).connect(output);
  }
  return {input,output};
}

// キャプチャ済みリング(captureBuffer/captureData/capturePos)の中から、書き込み位置と衝突しない
// ランダムな開始位置(秒)を探す。見つからなければnull。
function chaosRandomOffset(ctx,durationSec){
  const durSamples=Math.floor(durationSec*ctx.sampleRate);
  if(durSamples>=captureLen)return null;
  const guard=Math.floor(.05*ctx.sampleRate);
  for(let tries=0;tries<6;tries++){
    const start=Math.floor(Math.random()*(captureLen-durSamples));
    const end=start+durSamples;
    if(!(capturePos-guard<end&&capturePos+guard>start))return start/ctx.sampleRate;
  }
  return null;
}

function chaosTriggerGhost(key,amount){
  const ctx=getAudioContext();
  let g=chaosGhosts[key];
  const now=ctx.currentTime;
  if(!g||!g.playing){
    const dur=2.0;
    const start=chaosRandomOffset(ctx,dur);
    if(start==null)return;
    const src=ctx.createBufferSource();
    src.buffer=captureBuffer;src.loop=true;src.loopStart=start;src.loopEnd=start+dur;
    src.playbackRate.value=Math.pow(2,-1/12);
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=750;
    const gain=ctx.createGain();gain.gain.value=0;
    src.connect(lp).connect(gain).connect(chaosOut);
    src.start(now,start);
    g={src,gain,lp,playing:true};chaosGhosts[key]=g;
  }
  g.gain.gain.setTargetAtTime(Math.min(.16,amount*.16),now,.25);
}
function chaosReleaseGhost(key){
  const g=chaosGhosts[key];if(!g||!g.playing)return;
  const ctx=getAudioContext(),now=ctx.currentTime;
  g.gain.gain.setTargetAtTime(0,now,.4);g.playing=false;
  setTimeout(()=>{try{g.src.stop()}catch(_){}delete chaosGhosts[key]},1500);
}

function chaosSlicerStart(){
  if(chaosSlicerClockId)return;
  let step=0;
  const scheduleNext=()=>{
    const bpm=clamp(Number(bpmInput.value)||110,60,260);
    const rate=Math.max(.05,masterRate);
    const stepDur=60/(bpm*rate)/4; // 16分音符、現在のBPM×マスタースピードに追従
    chaosSlicerClockId=setTimeout(()=>{
      if(!chaosNodes)return;
      const ctx=getAudioContext(),t=ctx.currentTime;
      const on=step%3!==2;
      chaosNodes.slicerGate.gain.cancelScheduledValues(t);
      chaosNodes.slicerGate.gain.setTargetAtTime(on?1:.05,t,.005);
      step++;
      scheduleNext();
    },stepDur*1000);
  };
  scheduleNext();
}
function chaosSlicerStop(){
  if(chaosSlicerClockId){clearTimeout(chaosSlicerClockId);chaosSlicerClockId=null}
}

function chaosWeights(x,y){
  const angle=(Math.atan2(x,-y)*180/Math.PI+360)%360;
  const raw={};let sum=0;
  for(const d of CHAOS_DIRS){
    let diff=Math.abs(angle-CHAOS_DIR_ANGLE[d]);if(diff>180)diff=360-diff;
    const w=Math.max(0,Math.cos(diff*Math.PI/180));raw[d]=w*w;sum+=raw[d];
  }
  const weights={};for(const d of CHAOS_DIRS)weights[d]=sum>0?raw[d]/sum:.25;
  return weights;
}
function chaosBlendedGrainParams(weights){
  const p={size:0,rate:0,jitter:0,density:0,wobble:0};
  for(const d of CHAOS_DIRS){const w=weights[d],gp=CHAOS_GRAIN_PARAMS[d];p.size+=w*gp.size;p.rate+=w*gp.rate;p.jitter+=w*gp.jitter;p.density+=w*gp.density;p.wobble+=w*gp.wobble}
  return p;
}

function chaosScheduleGrain(ctx,time,params){
  if(capturePos===0&&captureData[0]===0&&captureData[Math.floor(captureLen/2)]===0)return; // まだ何も録れていない
  const src=ctx.createBufferSource();src.buffer=captureBuffer;
  const wobble=1+(Math.random()*2-1)*params.wobble;
  src.playbackRate.value=Math.max(.1,params.rate*wobble);
  const jitterOffset=(Math.random()*2-1)*params.jitter;
  let start=(chaosReadPos+jitterOffset)%(captureLen/getAudioContext().sampleRate);
  if(start<0)start+=captureLen/ctx.sampleRate;
  const dur=params.size;
  const env=ctx.createGain();
  env.gain.setValueAtTime(0,time);env.gain.linearRampToValueAtTime(1,time+Math.min(dur*.15,.012));env.gain.linearRampToValueAtTime(0,time+dur);
  src.connect(env).connect(chaosNodes.postGranular);
  const maxDur=Math.max(.01,captureLen/ctx.sampleRate-start);
  src.start(time,start,Math.min(dur+.05,maxDur));
  src.stop(time+dur+.05);
  chaosReadPos=(chaosReadPos+dur*params.rate*.6)%(captureLen/ctx.sampleRate);
}

function chaosSchedulerLoop(){
  const ctx=getAudioContext();
  const weights=chaosWeights(chaosCurrentPos.x,chaosCurrentPos.y);
  const params=chaosBlendedGrainParams(weights);
  const interval=1/Math.max(1,params.density);
  while(chaosNextGrainTime<ctx.currentTime+.12){
    chaosScheduleGrain(ctx,chaosNextGrainTime,params);
    chaosNextGrainTime+=interval;
  }
}

function chaosStartEngine(){
  getChaosBus();
  if(chaosSchedulerId)return;
  chaosSlicerStart();
  chaosNextGrainTime=getAudioContext().currentTime+.05;
  chaosSchedulerId=setInterval(chaosSchedulerLoop,30);
}
function chaosStopEngine(){
  if(chaosSchedulerId){clearInterval(chaosSchedulerId);chaosSchedulerId=null}
  chaosSlicerStop();
}

function chaosUpdate(x,y){
  const ctx=getAudioContext(),t=ctx.currentTime;
  const radius=Math.min(1,Math.hypot(x,y));
  const weights=chaosWeights(x,y);
  if(chaosNodes){
    chaosNodes.dryGain.gain.setTargetAtTime(1-radius,t,.05);
    chaosNodes.grainDry.gain.setTargetAtTime(radius*.55,t,.05);
    for(const d of CHAOS_DIRS)chaosNodes.sends[d].gain.setTargetAtTime(weights[d]*radius,t,.05);
  }
  const radiusExcess=Math.max(0,(radius-.6)/.4);
  let activeLabel="-",activeColor=null,maxHell=0;
  for(const pair of CHAOS_HELL_PAIRS){
    const purity=2*Math.min(weights[pair.a],weights[pair.b]);
    const amt=radiusExcess*purity;
    if(chaosNodes)chaosNodes.hellSends[pair.key].gain.setTargetAtTime(amt,t,.05);
    if(amt>.06)chaosTriggerGhost(pair.key,amt);else chaosReleaseGhost(pair.key);
    if(amt>maxHell){maxHell=amt;activeLabel=pair.label;activeColor=CHAOS_HELL_COLOR[pair.key]}
  }
  chaosDot.style.left=(50+x*50)+"%";chaosDot.style.top=(50+y*50)+"%";
  chaosDot.classList.toggle("holding",chaosHold);
  if(maxHell>.06){chaosFlash.style.opacity=Math.min(.5,maxHell*.6);chaosFlash.style.background=`radial-gradient(circle at center, transparent 40%, ${activeColor}22 100%)`}
  else chaosFlash.style.opacity=0;
}

const CHAOS_TOUCH_OFFSET_Y=56; // スマホでは指がパッドを隠すので、タッチ時は実際の指位置より少し上を狙う
function chaosClientY(e){return e.pointerType==="touch"?e.clientY-CHAOS_TOUCH_OFFSET_Y:e.clientY}

// --- カオスパッドの操作方式：相対(トラックパッド)方式 -----------------------------
// 触れた瞬間、ドットはそこにジャンプしない。触れた座標を「今のドット位置」に同期させて起点にし、
// そこから指がどれだけ・どの角度に動いたかだけをドット位置に加算する。だからボタン以外なら
// セクション内のどこを触っても(パッドの外でも)、そこが今のドット位置の代わりになって、
// 移動量がそのままドットに反映される。
let chaosDragAnchorClient={x:0,y:0},chaosDragAnchorPos={x:0,y:0};
const chaosSurface=document.getElementById("chaosSection");
chaosSurface.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return; // HOLD/0 LOCKなどのボタンはパッド操作に巻き込まない
  chaosStartEngine();
  chaosDragging=true;
  chaosDragAnchorClient={x:e.clientX,y:chaosClientY(e)};
  chaosDragAnchorPos={...chaosCurrentPos}; // 今のドット位置を起点として記憶(ここではドットは動かさない)
  try{chaosSurface.setPointerCapture(e.pointerId)}catch(_){}
});
chaosSurface.addEventListener("pointermove",e=>{
  if(!chaosDragging)return;
  const r=chaosPadEl.getBoundingClientRect();
  const dx=(e.clientX-chaosDragAnchorClient.x)/(r.width/2);
  const dy=(chaosClientY(e)-chaosDragAnchorClient.y)/(r.height/2);
  const px=chaosDragAnchorPos.x+dx,py=chaosDragAnchorPos.y+dy;
  const mag=Math.hypot(px,py),clamp2=mag>1?1/mag:1;
  const p={x:px*clamp2,y:py*clamp2};
  chaosCurrentPos=p;
  chaosUpdate(p.x,p.y);
});
window.addEventListener("pointerup",()=>{
  if(!chaosDragging)return;
  chaosDragging=false;
  if(!chaosHold){
    // HOLDオフ：手を離したらゼロ地点に戻る(デフォルトは中央=ドライ、0 LOCKで変更可能)
    chaosGoToZero();
  }
  // HOLDオン：離した場所にそのまま張り付く。currentPos/エンジンは触らずキープ。
});
let chaosZeroLocked=false;
chaosZeroLockBtn.addEventListener("click",()=>{
  chaosZeroLocked=!chaosZeroLocked;
  chaosZeroLockBtn.classList.toggle("on",chaosZeroLocked);
  if(chaosZeroLocked){
    // ON：その瞬間のパッド位置をゼロ地点として記憶する。
    chaosZero={...chaosCurrentPos};
  }else{
    // OFF：ゼロ地点を初期状態(真ん中=ドライ)に戻す。
    chaosZero={x:0,y:0};
  }
  chaosUpdateZeroMark();
  // 今まさに触ってる/HOLDで固定中でなければ、パッド自体も新しいゼロ地点へ即座にスナップさせる。
  // (これが無いと、表示上の値だけ変わって実際の音・ドットは次に触るまで古い位置に残ってしまう)
  if(!chaosDragging&&!chaosHold)chaosGoToZero();
});
chaosHoldBtn.addEventListener("click",()=>{
  chaosHold=!chaosHold;
  chaosHoldBtn.textContent="HOLD: "+(chaosHold?"ON":"OFF")+" (Z)";
  chaosHoldBtn.classList.toggle("on",chaosHold);
  if(!chaosHold){
    // HOLD解除：即座にゼロ地点へ戻す(エンジンの継続/停止判断はchaosGoToZero内で行う)
    chaosGoToZero();
  }
});
// ---- 八卦(バグア)描画：4方向+斜め4地獄=8つの区画に、意味の近い卦を割り当てて緑線で描く ----
function chaosBarRow(y,broken){
  const ns="http://www.w3.org/2000/svg";
  if(!broken){
    const l=document.createElementNS(ns,"line");
    l.setAttribute("x1",-15);l.setAttribute("x2",15);l.setAttribute("y1",y);l.setAttribute("y2",y);
    return [l];
  }
  const l1=document.createElementNS(ns,"line");l1.setAttribute("x1",-15);l1.setAttribute("x2",-3);l1.setAttribute("y1",y);l1.setAttribute("y2",y);
  const l2=document.createElementNS(ns,"line");l2.setAttribute("x1",3);l2.setAttribute("x2",15);l2.setAttribute("y1",y);l2.setAttribute("y2",y);
  return [l1,l2];
}
function chaosBuildBagua(){
  const svg=document.getElementById("chaosBagua");
  if(!svg||svg.dataset.built)return;
  svg.dataset.built="1";
  const ns="http://www.w3.org/2000/svg";
  const setAttrs=(el,attrs)=>{for(const k in attrs)el.setAttribute(k,attrs[k])};
  const frame=document.createElementNS(ns,"rect");
  setAttrs(frame,{x:6,y:6,width:188,height:188,rx:12,fill:"none",stroke:"#aaff00","stroke-width":2,opacity:.5});
  svg.appendChild(frame);
  const core=document.createElementNS(ns,"circle");
  setAttrs(core,{cx:100,cy:100,r:5,fill:"none",stroke:"#aaff00","stroke-width":1.5,opacity:.6});
  svg.appendChild(core);
  // pattern: 上から下へS(陽/実線)・B(陰/破線)。angleは12時方向を0として時計回り。
  const trigrams=[
    {angle:0,  pattern:"SSS"}, // N  Society   — 乾(天)
    {angle:45, pattern:"BSB"}, // NE 水の地獄  — 坎(水)
    {angle:90, pattern:"BSS"}, // E  Paraiso   — 兌(沢)
    {angle:135,pattern:"SBS"}, // SE 炎の地獄  — 離(火)
    {angle:180,pattern:"BBS"}, // S  Tokio     — 震(雷)
    {angle:225,pattern:"SBB"}, // SW 刃の地獄  — 艮(山)
    {angle:270,pattern:"BBB"}, // W  Zion      — 坤(地)
    {angle:315,pattern:"SSB"}, // NW 篩の地獄  — 巽(風)
  ];
  const r=70;
  for(const t of trigrams){
    const rad=t.angle*Math.PI/180;
    const cx=100+r*Math.sin(rad),cy=100-r*Math.cos(rad);
    const g=document.createElementNS(ns,"g");
    setAttrs(g,{transform:`translate(${cx},${cy}) rotate(${t.angle})`,stroke:"#aaff00","stroke-width":2.6,"stroke-linecap":"round",opacity:.8});
    const ys=[-13,0,13];
    for(let i=0;i<3;i++){
      const broken=t.pattern[i]==="B";
      for(const line of chaosBarRow(ys[i],broken))g.appendChild(line);
    }
    svg.appendChild(g);
  }
}
// chaosBuildBagua(); // v0.9.56: 画像埋め込みに切り替えたためSVG描画は無効化(関数定義は温存)

// --- PC向けキーボードショートカット: Z=HOLD、X=0 LOCK。入力欄にフォーカス中は無効化、
// キー押しっぱなしの連続発火(repeat)も無視する。
window.addEventListener("keydown",e=>{
  if(e.repeat)return;
  const el=document.activeElement;
  if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.isContentEditable))return;
  const key=e.key.toLowerCase();
  if(key==="z"){e.preventDefault();chaosHoldBtn.click()}
  else if(key==="x"){e.preventDefault();chaosZeroLockBtn.click()}
});
// ================= /CHAOS PAD =================

})();
</script>
