<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d6d6d6">
<title>Robolingual v0.9.2</title>
<style>
:root{--bg:#d6d6d6;--panel:#ececec;--shadow:#8b8b8b;--ink:#111;--accent:#c40000}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Geneva,Chicago,"Helvetica Neue",Arial,sans-serif;padding:18px}
.window{width:min(860px,100%);margin:0 auto;border:2px solid var(--ink);background:var(--panel);box-shadow:6px 6px 0 var(--shadow)}
.titlebar{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:2px solid var(--ink);background:repeating-linear-gradient(to bottom,#fff 0,#fff 2px,#aaa 2px,#aaa 4px);font-weight:700}.closebox{width:18px;height:18px;border:2px solid var(--ink);background:#ddd;flex:0 0 auto}.title{background:var(--panel);padding:2px 10px;margin:auto;transform:translateX(-13px)}
main{padding:18px}.row{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin-bottom:12px}label{font-weight:700}.filebox{display:flex;gap:10px;align-items:center;min-width:0}
button,.file-button,input,select{font:inherit}button,.file-button,select{appearance:none;border:2px solid var(--ink);background:#e9e9e9;color:var(--ink);box-shadow:2px 2px 0 #777;padding:10px 14px;cursor:pointer;font-weight:700;border-radius:0}button:active,.file-button:active{box-shadow:none;transform:translate(2px,2px)}button:disabled{color:#777;cursor:not-allowed}input[type=file]{display:none}#filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#wave{width:100%;height:180px;border:2px solid var(--ink);background:#fff;display:block}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#bpm,#bars{width:92px;border:2px solid var(--ink);background:#fff;padding:9px;border-radius:0;font-weight:700}
#translate{width:100%;font-size:20px;padding:15px;background:var(--ink);color:#fff;box-shadow:4px 4px 0 #777;margin:4px 0 14px}#status{min-height:22px;margin:0 0 16px;font-size:14px;font-weight:700}.mode{border-top:2px solid var(--ink);padding:14px 0}.mode-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.mode h2{margin:0;font-size:18px}.switches{display:flex;gap:8px;align-items:center}.switches input{position:absolute;opacity:0;pointer-events:none}.switches label{display:inline-flex;align-items:center;justify-content:center;min-width:58px;border:2px solid var(--ink);background:#e9e9e9;box-shadow:2px 2px 0 #777;padding:8px 10px;cursor:pointer}.switches input:checked+label{background:var(--ink);color:#fff;box-shadow:none;transform:translate(2px,2px)}.downloads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.download{width:100%;padding:8px}.transport{display:flex;justify-content:flex-end;margin:0 0 10px}.stop{min-width:100px}.hidden{display:none}
@media(max-width:600px){body{padding:10px}main{padding:12px}.row{grid-template-columns:1fr;gap:6px}.outputs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="window"><div class="titlebar"><div class="closebox"></div><div class="title">ROBOLINGUAL v0.9.2</div></div><main>
<div class="row"><label>Source</label><div class="filebox"><label class="file-button" for="source">Choose Audio / Video</label><input id="source" type="file" accept="audio/*,video/*,.wav,.mp3,.m4a,.aac,.mp4,.m4v,.mov,.qt"><span id="filename">No source</span></div></div>

<div class="row"><label>Waveform</label><div><canvas id="wave"></canvas></div></div>
<div class="row"><label>Timing</label><div class="controls"><input id="bpm" type="number" min="60" max="260" step="1" value="170"><span>BPM</span><input id="bars" type="number" min="4" max="4" step="1" value="4" disabled><span>bars</span></div></div>
<button id="translate" disabled>Translate</button><div id="status"></div>
<section id="results" class="hidden">
<div class="transport"><button id="stopAll" class="stop" type="button">STOP</button></div>
<div class="mode" data-mode="normal">
  <div class="mode-head"><h2>Normal</h2><div class="switches">
    <input id="normalOff" type="radio" name="normal" value="off" checked><label for="normalOff">OFF</label>
    <input id="normalA" type="radio" name="normal" value="a"><label for="normalA">A</label>
    <input id="normalB" type="radio" name="normal" value="b"><label for="normalB">B</label>
  </div></div>
  <div class="downloads" id="normalDownloads"></div>
</div>
<div class="mode" data-mode="abnormal">
  <div class="mode-head"><h2>Abnormal</h2><div class="switches">
    <input id="abnormalOff" type="radio" name="abnormal" value="off" checked><label for="abnormalOff">OFF</label>
    <input id="abnormalA" type="radio" name="abnormal" value="a"><label for="abnormalA">A</label>
    <input id="abnormalB" type="radio" name="abnormal" value="b"><label for="abnormalB">B</label>
  </div></div>
  <div class="downloads" id="abnormalDownloads"></div>
</div>
<div class="mode" data-mode="hyper">
  <div class="mode-head"><h2>Hyper</h2><div class="switches">
    <input id="hyperOff" type="radio" name="hyper" value="off" checked><label for="hyperOff">OFF</label>
    <input id="hyperA" type="radio" name="hyper" value="a"><label for="hyperA">A</label>
    <input id="hyperB" type="radio" name="hyper" value="b"><label for="hyperB">B</label>
  </div></div>
  <div class="downloads" id="hyperDownloads"></div>
</div>
</section>
</main></div>
<script>
(()=>{"use strict";
const sourceInput=document.getElementById("source"),filename=document.getElementById("filename"),wave=document.getElementById("wave"),bpmInput=document.getElementById("bpm"),barsInput=document.getElementById("bars"),translateButton=document.getElementById("translate"),status=document.getElementById("status"),results=document.getElementById("results");
let sourceBuffer=null,audioContext=null,mono=null,attacks=[];
const objectURLs=[];
const rendered={normal:{a:null,b:null},abnormal:{a:null,b:null},hyper:{a:null,b:null}};
let mixerSources=[],mixerGains={},mixerRunning=false;
const setStatus=t=>status.textContent=t;
function getAudioContext(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();return audioContext}
function clearURLs(){while(objectURLs.length)URL.revokeObjectURL(objectURLs.pop())}
sourceInput.addEventListener("change",async()=>{stopMixer(true);clearURLs();results.classList.add("hidden");translateButton.disabled=true;sourceBuffer=null;mono=null;attacks=[];const file=sourceInput.files&&sourceInput.files[0];if(!file){filename.textContent="No source";drawEmptyWave();return}filename.textContent=file.name;setStatus(file.type.startsWith("video/")?"Loading video audio...":"Loading audio...");try{const ctx=getAudioContext();if(ctx.state==="suspended")await ctx.resume();const data=await file.arrayBuffer();sourceBuffer=await decodeSourceFile(ctx,data,file);mono=toMono(sourceBuffer);attacks=detectAttacks(mono,sourceBuffer.sampleRate);drawWave();translateButton.disabled=false;setStatus(`Ready — ${file.type.startsWith("video/")?"video audio / ":""}${attacks.length} attacks detected`)}catch(e){console.error(e);drawEmptyWave();const ext=(file.name.split(".").pop()||"").toUpperCase();setStatus(`Could not extract audio from ${ext||"this file"}. Try exporting from CapCut with HDR off and H.264.`)}});
async function decodeSourceFile(ctx,data,file){
  // Audio files and browser-decodable video files use the fast path first.
  try{
    return await ctx.decodeAudioData(data.slice(0));
  }catch(firstError){
    if(!file.type.startsWith("video/")) throw firstError;
  }

  // iPhone CapCut fallback:
  // Safari may play a video that decodeAudioData cannot open. In that case,
  // play the local video through Web Audio and record its PCM output.
  return await extractVideoAudioByPlayback(ctx,data,file);
}

async function extractVideoAudioByPlayback(ctx,data,file){
  const blob=new Blob([data],{type:file.type||"video/mp4"});
  const url=URL.createObjectURL(blob);
  objectURLs.push(url);

  const video=document.createElement("video");
  video.preload="auto";
  video.playsInline=true;
  video.setAttribute("playsinline","");
  video.setAttribute("webkit-playsinline","");
  video.src=url;
  video.volume=1;

  await new Promise((resolve,reject)=>{
    const done=()=>{cleanup();resolve()};
    const fail=()=>{cleanup();reject(new Error("The browser could not open this video."))};
    const cleanup=()=>{
      video.removeEventListener("loadedmetadata",done);
      video.removeEventListener("canplay",done);
      video.removeEventListener("error",fail);
    };
    video.addEventListener("loadedmetadata",done,{once:true});
    video.addEventListener("canplay",done,{once:true});
    video.addEventListener("error",fail,{once:true});
    video.load();
  });

  if(!Number.isFinite(video.duration)||video.duration<=0){
    throw new Error("Video duration is unavailable.");
  }

  if(ctx.state==="suspended") await ctx.resume();

  const mediaSource=ctx.createMediaElementSource(video);
  const processor=ctx.createScriptProcessor(4096,2,2);
  const silentGain=ctx.createGain();
  silentGain.gain.value=0;

  const channelChunks=[[],[]];
  let channelCount=0;
  let capturedFrames=0;
  let finished=false;

  mediaSource.connect(processor);
  processor.connect(silentGain);
  silentGain.connect(ctx.destination);

  processor.onaudioprocess=(event)=>{
    if(finished)return;
    const input=event.inputBuffer;
    channelCount=Math.max(channelCount,input.numberOfChannels);
    for(let ch=0;ch<input.numberOfChannels;ch++){
      const copy=new Float32Array(input.getChannelData(ch));
      channelChunks[ch].push(copy);
    }
    capturedFrames+=input.length;
  };

  const progress=()=>{
    const pct=Math.min(100,Math.round((video.currentTime/video.duration)*100));
    setStatus(`Extracting CapCut video audio... ${pct}%`);
  };
  video.addEventListener("timeupdate",progress);

  await new Promise(async(resolve,reject)=>{
    const timeout=setTimeout(()=>{
      finish();
      reject(new Error("Video audio extraction timed out."));
    },Math.max(30000,(video.duration+20)*1000));

    const finish=()=>{
      if(finished)return;
      finished=true;
      clearTimeout(timeout);
      video.removeEventListener("ended",onEnded);
      video.removeEventListener("error",onError);
      video.removeEventListener("timeupdate",progress);
      processor.onaudioprocess=null;
      try{video.pause()}catch(_){}
      try{mediaSource.disconnect()}catch(_){}
      try{processor.disconnect()}catch(_){}
      try{silentGain.disconnect()}catch(_){}
    };
    const onEnded=()=>{finish();resolve()};
    const onError=()=>{finish();reject(new Error("Playback failed while extracting audio."))};

    video.addEventListener("ended",onEnded,{once:true});
    video.addEventListener("error",onError,{once:true});

    try{
      video.currentTime=0;
      await video.play();
    }catch(error){
      finish();
      reject(new Error("Tap Choose Audio / Video again and allow video playback."));
    }
  });

  if(capturedFrames<1||channelCount<1){
    throw new Error("No audio track was captured from this video.");
  }

  const out=ctx.createBuffer(channelCount,capturedFrames,ctx.sampleRate);
  for(let ch=0;ch<channelCount;ch++){
    const target=out.getChannelData(ch);
    let offset=0;
    for(const chunk of channelChunks[ch]){
      target.set(chunk,offset);
      offset+=chunk.length;
    }
  }
  return out;
}
[bpmInput,barsInput].forEach(el=>el.addEventListener("input",()=>sourceBuffer&&drawWave()));
translateButton.addEventListener("click",async()=>{
  if(!sourceBuffer||!mono)return;
  const bpm=clamp(Number(bpmInput.value)||170,60,260),bars=4;
  bpmInput.value=String(Math.round(bpm));barsInput.value="4";
  translateButton.disabled=true;
  stopMixer(true);
  clearURLs();
  setStatus("Translating on beat grid...");
  await nextFrame();
  try{
    const sr=sourceBuffer.sampleRate,total=Math.floor(sr*(60/bpm)*4*bars);
    const jobs=[
      ["normal","a","Normal",0,makeNormal],
      ["normal","b","Normal",1,makeNormal],
      ["abnormal","a","Abnormal",0,makeAbnormal],
      ["abnormal","b","Abnormal",1,makeAbnormal],
      ["hyper","a","Hyper",0,makeHyper],
      ["hyper","b","Hyper",1,makeHyper]
    ];
    normalDownloads.innerHTML="";
    abnormalDownloads.innerHTML="";
    hyperDownloads.innerHTML="";
    for(const[modeKey,variantKey,mode,variant,maker]of jobs){
      const rng=mulberry32(cryptoSeed());
      const output=maker(mono,sr,bpm,bars,total,attacks,rng);
      softLimit(output,.96);
      rendered[modeKey][variantKey]=toAudioBuffer(output,sr);
      const blob=encodeWav(output,sr),url=URL.createObjectURL(blob);
      objectURLs.push(url);
      addDownload(modeKey,mode,variant,url);
      await nextFrame();
    }
    results.classList.remove("hidden");
    resetSwitches();
    setStatus("Translated");
  }catch(e){
    console.error(e);
    setStatus("Translation failed.");
  }finally{
    translateButton.disabled=false;
  }
});

function toAudioBuffer(samples,sr){
  const ctx=getAudioContext();
  const buffer=ctx.createBuffer(1,samples.length,sr);
  buffer.copyToChannel(samples,0);
  return buffer;
}

function addDownload(modeKey,mode,variant,url){
  const a=document.createElement("a");
  a.href=url;
  a.download=`robolingual-v092-${mode.toLowerCase()}-${variant===0?"a":"b"}.wav`;
  const b=document.createElement("button");
  b.className="download";
  b.type="button";
  b.textContent=variant===0?"Download A":"Download B";
  a.appendChild(b);
  document.getElementById(`${modeKey}Downloads`).appendChild(a);
}

function resetSwitches(){
  for(const mode of["normal","abnormal","hyper"]){
    const off=document.querySelector(`input[name="${mode}"][value="off"]`);
    if(off)off.checked=true;
  }
}

async function startMixer(){
  if(mixerRunning)return;
  const ctx=getAudioContext();
  if(ctx.state==="suspended")await ctx.resume();
  const when=ctx.currentTime+.04;
  mixerSources=[];
  mixerGains={};
  for(const mode of["normal","abnormal","hyper"]){
    for(const variant of["a","b"]){
      const buffer=rendered[mode][variant];
      if(!buffer)continue;
      const source=ctx.createBufferSource();
      const gain=ctx.createGain();
      source.buffer=buffer;
      source.loop=true;
      source.loopStart=0;
      source.loopEnd=buffer.duration;
      gain.gain.setValueAtTime(0,when);
      source.connect(gain).connect(ctx.destination);
      source.start(when);
      mixerSources.push(source);
      mixerGains[`${mode}-${variant}`]=gain;
    }
  }
  mixerRunning=true;
}

function updateMixer(){
  const anyOn=["normal","abnormal","hyper"].some(mode=>{
    const selected=document.querySelector(`input[name="${mode}"]:checked`);
    return selected&&selected.value!=="off";
  });
  if(anyOn&&!mixerRunning){
    startMixer().then(applyMixerGains);
  }else{
    applyMixerGains();
  }
}

function applyMixerGains(){
  if(!mixerRunning)return;
  const ctx=getAudioContext();
  const now=ctx.currentTime;
  for(const mode of["normal","abnormal","hyper"]){
    const selected=document.querySelector(`input[name="${mode}"]:checked`);
    const value=selected?selected.value:"off";
    for(const variant of["a","b"]){
      const gain=mixerGains[`${mode}-${variant}`];
      if(!gain)continue;
      const target=value===variant?1:0;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setTargetAtTime(target,now,.008);
    }
  }
}

function stopMixer(reset=false){
  for(const source of mixerSources){
    try{source.stop()}catch(_){}
    try{source.disconnect()}catch(_){}
  }
  for(const gain of Object.values(mixerGains)){
    try{gain.disconnect()}catch(_){}
  }
  mixerSources=[];
  mixerGains={};
  mixerRunning=false;
  if(reset)resetSwitches();
}

document.querySelectorAll('.switches input[type="radio"]').forEach(el=>el.addEventListener("change",updateMixer));
document.getElementById("stopAll").addEventListener("click",()=>stopMixer(true));

function detectAttacks(src,sr){const hop=Math.max(64,Math.floor(sr*.005)),win=Math.max(hop*2,Math.floor(sr*.02)),env=[];for(let p=0;p<src.length;p+=hop){let sum=0,end=Math.min(src.length,p+win);for(let i=p;i<end;i++)sum+=src[i]*src[i];env.push(Math.sqrt(sum/Math.max(1,end-p)))}let max=0;for(const v of env)if(v>max)max=v;const floor=max*.035,minGap=Math.floor(.065*sr/hop);const out=[];let last=-minGap;for(let i=2;i<env.length-2;i++){const rise=env[i]-Math.min(env[i-2],env[i-1]),local=env[i]>=env[i-1]&&env[i]>=env[i+1];if(env[i]>floor&&rise>max*.018&&local&&i-last>=minGap){let sample=i*hop;const search=Math.min(src.length,sample+Math.floor(sr*.018));while(sample<search&&Math.abs(src[sample])<maxAbs(src,sample,search)*.12)sample++;out.push(sample);last=i}}if(!out.length)out.push(0);return out}
function maxAbs(src,a,b){let m=0;for(let i=a;i<b;i++)m=Math.max(m,Math.abs(src[i]));return m}
function makeSlices(src,sr,attackList){const list=[];for(let i=0;i<attackList.length;i++){const start=attackList[i],next=i+1<attackList.length?attackList[i+1]:src.length;let end=Math.min(src.length,Math.max(start+Math.floor(sr*.09),next));const maxLen=Math.floor(sr*1.8);end=Math.min(end,start+maxLen);if(end-start>=Math.floor(sr*.045))list.push({start,end,length:end-start})}return list.length?list:[{start:0,end:Math.min(src.length,Math.floor(sr*.5)),length:Math.min(src.length,Math.floor(sr*.5))}]}
function grooveCell(rng,normalMode){if(normalMode)return pick([[0],[0,.5],[0,.75],[0,.5,.75]],rng);return pick([[0],[0,.5],[0,.25,.5,.75],[0,.25,.5,.75,.875]],rng)}
function renderBeatCell(out,src,beatStart,beatLength,cell,sl,sr,gain,rng,natural){for(let i=0;i<cell.length;i++){const pos=cell[i],next=i+1<cell.length?cell[i+1]:1,dest=beatStart+Math.floor(pos*beatLength),space=Math.max(1,Math.floor((next-pos)*beatLength)),len=natural?Math.min(Math.floor(space*.92),Math.max(Math.floor(sr*.06),sl.length)):Math.max(Math.floor(sr*.025),Math.min(sl.length,Math.floor(space*(.58+rng()*.24))));if(natural)renderNatural(out,src,dest,sl,len,gain,rng);else renderOneShot(out,src,dest,sl.start,len,gain)}}
function makeNormal(src,sr,bpm,bars,total,attackList,rng){
 const out=new Float32Array(total),beat=sr*60/bpm,bar=beat*4,slices=makeSlices(src,sr,attackList);
 let sharedAnchor=null;
 for(let b=0;b<bars;b++){
   const base=Math.floor(b*bar);
   if(b%2===0||!sharedAnchor)sharedAnchor=grooveCell(rng,true);
   const beat2=grooveCell(rng,true),beat4=grooveCell(rng,true),cells=[sharedAnchor,beat2,sharedAnchor,beat4];

   // Normalの通常グルーヴ。Beat1=Beat3、アンカーは2小節維持。
   for(let q=0;q<4;q++){
     const sl=pickWeightedSlice(slices,rng,true);
     renderBeatCell(out,src,base+Math.floor(q*beat),beat,cells[q],sl,sr,.72+rng()*.12,rng,true);
   }

   // 2拍目または4拍目に、最大3拍の長音を追加。
   // 長音中は 0, +1, +2, +3, +4, +5 半音へ段階的に上昇する。
   if(rng()<.72){
     const startBeat=rng()<.58?1:3;
     const maxRemaining=Math.max(1,Math.min(3,Math.floor((total-(base+startBeat*beat))/beat)));
     const sustainBeats=1+Math.floor(rng()*maxRemaining);
     const sl=pickWeightedSlice(slices,rng,true);
     const dest=base+Math.floor(startBeat*beat);
     const target=Math.min(total-dest,Math.floor(beat*sustainBeats));
     renderPitchRise(out,src,dest,sl,target,.64+rng()*.12);
   }
 }
 return out
}
function makeAbnormal(src,sr,bpm,bars,total,attackList,rng){
 const out=new Float32Array(total),beat=sr*60/bpm,bar=beat*4;
 const slices=ensureMinimumSlices(makeSlices(src,sr,attackList),src,sr,3);
 let sharedAnchor=null,sharedAnchorSlice=null;

 for(let b=0;b<bars;b++){
   const base=Math.floor(b*bar);
   if(b%2===0||!sharedAnchor){
     sharedAnchor=grooveCell(rng,false);
     sharedAnchorSlice=pick(slices,rng);
   }

   // 各小節で最低3種類のスライスを必ず使用。
   const others=slices.filter(s=>s!==sharedAnchorSlice);
   const slice2=pick(others.length?others:slices,rng);
   const remaining=others.filter(s=>s!==slice2);
   const slice4=pick(remaining.length?remaining:others.length?others:slices,rng);

   const beat2=grooveCell(rng,false),beat4=grooveCell(rng,false);
   const cells=[sharedAnchor,beat2,sharedAnchor,beat4];
   const beatSlices=[sharedAnchorSlice,slice2,sharedAnchorSlice,slice4];

   for(let q=0;q<4;q++){
     renderBeatCell(out,src,base+Math.floor(q*beat),beat,cells[q],beatSlices[q],sr,.70+rng()*.15,rng,false);
   }
 }
 return out
}
function makeHyper(src,sr,bpm,bars,total,attackList,rng){const out=new Float32Array(total),beat=sr*60/bpm,bar=Math.floor(beat*4);for(let b=0;b<bars;b++){const localTotal=Math.min(bar,total-b*bar),mode=(b%3===2||rng()<.42)?"ab":"normal",tmp=mode==="ab"?makeAbnormal(src,sr,bpm,1,localTotal,attackList,rng):makeNormal(src,sr,bpm,1,localTotal,attackList,rng);for(let i=0;i<tmp.length&&b*bar+i<out.length;i++)out[b*bar+i]+=tmp[i]}return out}
function pickWeightedSlice(slices,rng,longPreferred){const filtered=slices.filter(s=>longPreferred?s.length>12000:s.length>1500);return pick(filtered.length?filtered:slices,rng)}
function ensureMinimumSlices(slices,src,sr,count){
 if(slices.length>=count)return slices;
 const out=slices.slice();
 const seg=Math.max(Math.floor(sr*.08),Math.floor(src.length/count));
 for(let i=0;out.length<count&&i<count;i++){
   const start=Math.min(src.length-1,i*seg);
   const end=Math.min(src.length,start+seg);
   if(end-start>=Math.floor(sr*.045))out.push({start,end,length:end-start});
 }
 while(out.length<count)out.push(out[out.length%Math.max(1,out.length)]||{start:0,end:Math.min(src.length,Math.floor(sr*.25)),length:Math.min(src.length,Math.floor(sr*.25))});
 return out
}
function renderPitchRise(out,src,dest,sl,target,gain){
 if(target<=0||sl.length<2)return;
 const attack=Math.min(96,Math.max(16,Math.floor(target*.01)));
 const release=Math.min(Math.floor(target*.18),Math.max(128,Math.floor(target*.08)));
 const loopStart=sl.start+Math.floor(sl.length*.35);
 const loopLength=Math.max(2,sl.end-loopStart);
 let phase=0;
 for(let i=0;i<target&&dest+i<out.length;i++){
   const progress=i/Math.max(1,target-1);
   const semitone=Math.min(5,Math.floor(progress*6));
   const ratio=Math.pow(2,semitone/12);
   let pos;
   if(phase<sl.length-1)pos=sl.start+phase;
