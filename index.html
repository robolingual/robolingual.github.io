<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d6d6d6">
<title>Robolingual v0.9.12</title>
<style>
:root{--bg:#d6d6d6;--panel:#ececec;--shadow:#8b8b8b;--ink:#111;--accent:#c40000}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Geneva,Chicago,"Helvetica Neue",Arial,sans-serif;padding:18px}
.window{width:min(860px,100%);margin:0 auto;border:2px solid var(--ink);background:var(--panel);box-shadow:6px 6px 0 var(--shadow)}
.titlebar{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:2px solid var(--ink);background:repeating-linear-gradient(to bottom,#fff 0,#fff 2px,#aaa 2px,#aaa 4px);font-weight:700}.closebox{width:18px;height:18px;border:2px solid var(--ink);background:#ddd;flex:0 0 auto}.title{background:var(--panel);padding:2px 10px;margin:auto;transform:translateX(-13px)}
main{padding:18px}.row{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin-bottom:12px}label{font-weight:700}.filebox{display:flex;gap:10px;align-items:center;min-width:0}
button,.file-button,input,select{font:inherit}button,.file-button,select{appearance:none;border:2px solid var(--ink);background:#e9e9e9;color:var(--ink);box-shadow:2px 2px 0 #777;padding:10px 14px;cursor:pointer;font-weight:700;border-radius:0}button:active,.file-button:active{box-shadow:none;transform:translate(2px,2px)}button:disabled{color:#777;cursor:not-allowed}input[type=file]{display:none}#filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#wave{width:100%;height:180px;border:2px solid var(--ink);background:#fff;display:block}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#bpm,#bars{width:92px;border:2px solid var(--ink);background:#fff;padding:9px;border-radius:0;font-weight:700}
#translate{width:100%;font-size:20px;padding:15px;background:var(--ink);color:#fff;box-shadow:4px 4px 0 #777;margin:4px 0 14px}#status{min-height:22px;margin:0 0 16px;font-size:14px;font-weight:700}.mode{border-top:2px solid var(--ink);padding:14px 0}.mode-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.mode h2{margin:0;font-size:18px}.switches{display:flex;gap:8px;align-items:center}.switches input{position:absolute;opacity:0;pointer-events:none}.switches label{display:inline-flex;align-items:center;justify-content:center;min-width:58px;border:2px solid var(--ink);background:#e9e9e9;box-shadow:2px 2px 0 #777;padding:8px 10px;cursor:pointer}.switches input:checked+label{background:var(--ink);color:#fff;box-shadow:none;transform:translate(2px,2px)}.downloads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.download{width:100%;padding:8px}.mixer-layout{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:18px;align-items:stretch}.mixer-main{min-width:0}.speed-panel{border:2px solid var(--ink);background:#ddd;display:flex;flex-direction:column;align-items:center;padding:10px 8px;min-height:340px}.speed-title{font-size:12px;font-weight:900;letter-spacing:.04em;text-align:center}.speed-value{font-family:monospace;font-size:18px;font-weight:900;margin:5px 0 7px}.speed-scale{flex:1;display:grid;grid-template-columns:36px 32px;align-items:stretch;justify-content:center;gap:4px;min-height:250px}.speed-labels{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-family:monospace;font-size:11px;font-weight:700;padding:4px 0}.speed-slider{width:32px;height:100%;writing-mode:vertical-lr;direction:rtl;accent-color:#111;cursor:ns-resize}.speed-reset{width:100%;padding:7px 3px;margin-top:8px;font-size:11px}.transport{display:flex;justify-content:flex-end;margin:0 0 10px}.stop{min-width:100px}.hidden{display:none}@media(max-width:620px){.mixer-layout{grid-template-columns:minmax(0,1fr) 82px;gap:10px}.speed-panel{padding:8px 5px}.switches{gap:4px}.switches label{min-width:46px;padding:7px 6px}}
@media(max-width:600px){body{padding:10px}main{padding:12px}.row{grid-template-columns:1fr;gap:6px}.outputs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="window"><div class="titlebar"><div class="closebox"></div><div class="title">ROBOLINGUAL v0.9.12</div></div><main>
<div class="row"><label>Source</label><div class="filebox"><label class="file-button" for="source">Choose Audio / Video</label><input id="source" type="file" accept="audio/*,video/*,.wav,.mp3,.m4a,.aac,.mp4,.m4v,.mov,.qt"><span id="filename">No source</span></div></div>

<div class="row"><label>Waveform</label><div><canvas id="wave"></canvas></div></div>
<div class="row"><label>Timing</label><div class="controls"><input id="bpm" type="number" min="60" max="260" step="1" value="170"><span>BPM</span><input id="bars" type="number" min="4" max="4" step="1" value="4" disabled><span>bars</span></div></div>
<button id="translate" disabled>Translate</button><div id="status"></div>
<section id="results" class="hidden">
<div class="mixer-layout">
<div class="mixer-main">
<div class="transport"><button id="stopAll" class="stop" type="button">STOP</button></div>
<div class="mode" data-mode="normal">
  <div class="mode-head"><h2>Normal</h2><div class="switches">
    <input id="normalOff" type="radio" name="normal" value="off" checked><label for="normalOff">OFF</label>
    <input id="normalA" type="radio" name="normal" value="a"><label for="normalA">A</label>
    <input id="normalB" type="radio" name="normal" value="b"><label for="normalB">B</label>
  </div></div>
  <div class="downloads" id="normalDownloads"></div>
</div>
<div class="mode" data-mode="abnormal">
  <div class="mode-head"><h2>Abnormal</h2><div class="switches">
    <input id="abnormalOff" type="radio" name="abnormal" value="off" checked><label for="abnormalOff">OFF</label>
    <input id="abnormalA" type="radio" name="abnormal" value="a"><label for="abnormalA">A</label>
    <input id="abnormalB" type="radio" name="abnormal" value="b"><label for="abnormalB">B</label>
  </div></div>
  <div class="downloads" id="abnormalDownloads"></div>
</div>
<div class="mode" data-mode="hyper">
  <div class="mode-head"><h2>Hyper</h2><div class="switches">
    <input id="hyperOff" type="radio" name="hyper" value="off" checked><label for="hyperOff">OFF</label>
    <input id="hyperA" type="radio" name="hyper" value="a"><label for="hyperA">A</label>
    <input id="hyperB" type="radio" name="hyper" value="b"><label for="hyperB">B</label>
  </div></div>
  <div class="downloads" id="hyperDownloads"></div>
</div>
</div>
<aside class="speed-panel" aria-label="Master speed">
  <div class="speed-title">MASTER<br>SPEED</div>
  <div id="speedValue" class="speed-value">1.00×</div>
  <div class="speed-scale">
    <div class="speed-labels"><span>⅓×</span><span>0.5×</span><span>1.0×</span><span>2.0×</span><span>3.0×</span></div>
    <input id="speedSlider" class="speed-slider" type="range" min="-1000" max="1000" step="1" value="0" aria-label="Master speed, one third to 3 times">
  </div>
  <button id="speedReset" class="speed-reset" type="button">RESET 1.00×</button>
</aside>
</div>
</section>
</main></div>

function getAudioContext(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();return audioContext}
async function loadSoundLogo(){
  if(soundLogoBuffer)return soundLogoBuffer;
  const ctx=getAudioContext();
  const response=await fetch(SOUND_LOGO_DATA);
  const data=await response.arrayBuffer();
  soundLogoBuffer=await ctx.decodeAudioData(data.slice(0));
  return soundLogoBuffer;
}
function buildSoundLogoTrack(total,sr,bpm){
  if(!soundLogoBuffer)return null;
  const out=getAudioContext().createBuffer(1,total,sr);
  const dest=out.getChannelData(0);
  const beat=sr*60/bpm;
  const start=Math.floor(14*beat); // 4小節目・3拍目
  const channels=soundLogoBuffer.numberOfChannels;
  const ratio=soundLogoBuffer.sampleRate/sr;
  const available=Math.max(0,total-start);
  const frames=Math.min(available,Math.floor(soundLogoBuffer.length/ratio));
  for(let i=0;i<frames;i++){
    const pos=i*ratio,p0=Math.floor(pos),p1=Math.min(soundLogoBuffer.length-1,p0+1),frac=pos-p0;
    let sample=0;
    for(let ch=0;ch<channels;ch++){
      const d=soundLogoBuffer.getChannelData(ch);
      sample+=(d[p0]*(1-frac)+d[p1]*frac)/channels;
    }
    dest[start+i]=sample;
  }
  // 埋め込みMP3の音量差を吸収し、サウンドロゴを常に前へ出す。
  let peak=0;
  for(let i=start;i<start+frames;i++)peak=Math.max(peak,Math.abs(dest[i]));
  if(peak>1e-7){
    const scale=.98/peak;
    for(let i=start;i<start+frames;i++)dest[i]*=scale;
  }
  return out;
}
function clearURLs(){while(objectURLs.length)URL.revokeObjectURL(objectURLs.pop())}
// 同じファイルを再選択できるようにする。iPhoneでは選択前に value を消すと
// 写真アプリから戻った直後の file を失う場合があるため、取得後にリセットする。
sourceInput.addEventListener("click",()=>{
  setStatus("Waiting for iPhone Photos to hand over the file...");
});

sourceInput.addEventListener("change",async()=>{
  stopMixer(true);
  clearURLs();
  results.classList.add("hidden");
  translateButton.disabled=true;
  sourceBuffer=null;mono=null;attacks=[];

  const file=sourceInput.files&&sourceInput.files[0];
  if(!file){filename.textContent="No source";drawEmptyWave();return}
  // File オブジェクトを確保してから input を空にする。これで同じ動画も再選択できる。
  sourceInput.value="";

  filename.textContent=file.name;
  const isVideo=isVideoFile(file);
  setStatus(isVideo?"Preparing video audio...":"Loading audio...");

  try{
    const ctx=getAudioContext();
    if(ctx.state==="suspended")await ctx.resume();
    sourceBuffer=await decodeSourceFile(ctx,file,isVideo);
    mono=toMono(sourceBuffer);
    attacks=detectAttacks(mono,sourceBuffer.sampleRate);
    drawWave();
    translateButton.disabled=false;
    setStatus(`Ready — ${isVideo?"video audio / ":""}${attacks.length} attacks detected`);
  }catch(e){
    console.error(e);
    drawEmptyWave();
    const ext=(file.name.split(".").pop()||"").toUpperCase();
    const detail=e&&e.message?` (${e.message})`:"";
    setStatus(`Could not extract audio from ${ext||"this file"}${detail}`);
  }
});

function isVideoFile(file){
  const type=(file.type||"").toLowerCase();
  const name=(file.name||"").toLowerCase();
  if(type.startsWith("video/"))return true;
  if(type.startsWith("audio/"))return false;
  if(/\.(mp4|m4v|mov|qt|webm|3gp|3g2|avi|mkv)$/i.test(name))return true;
  if(/\.(wav|mp3|m4a|aac|flac|ogg|oga|opus|aif|aiff)$/i.test(name))return false;
  // iPhoneの「写真」経由では MIME や拡張子が空になる場合がある。
  // 不明なメディアは、止まり続ける decodeAudioData へ送らず動画経路に倒す。
  return true;
}

async function decodeSourceFile(ctx,file,isVideo){
  if(!isVideo){
    const data=await file.arrayBuffer();
    return await ctx.decodeAudioData(data.slice(0));
  }

  // 動画コンテナをdecodeAudioDataへ渡すと、iPhone Safariでは
  // 失敗せずPromiseが止まり続ける場合がある。
  // 動画は形式・容量を問わず、必ず明示タップの再生経由で抽出する。
  return await extractVideoAudioByPlayback(ctx,file);
}

function requestVideoPlayback(video,ctx){
  return new Promise((resolve,reject)=>{
    const button=document.createElement("button");
    button.type="button";
    button.textContent="Tap to read video audio";
    button.style.cssText="display:block;width:100%;margin:8px 0 14px;padding:14px;background:#111;color:#fff";
    status.insertAdjacentElement("afterend",button);
    setStatus("Video is ready — tap once to read its audio");

    const cleanup=()=>{if(button.parentNode)button.parentNode.removeChild(button)};
    button.addEventListener("click",async()=>{
      button.disabled=true;
      button.textContent="Starting...";
      try{
        if(ctx.state==="suspended")await ctx.resume();
        await video.play();
        cleanup();
        resolve();
      }catch(error){
        cleanup();
        reject(new Error("Safari could not start the selected video."));
      }
    },{once:true});
  });
}

async function extractVideoAudioByPlayback(ctx,file){
  const url=URL.createObjectURL(file);
  objectURLs.push(url);

  const video=document.createElement("video");
  video.preload="metadata";
  video.playsInline=true;
  video.setAttribute("playsinline","");
  video.setAttribute("webkit-playsinline","");
  video.src=url;
  video.volume=1;
  video.muted=false;
  video.controls=false;
  video.disablePictureInPicture=true;
  // iOS Safariは画面外・極小・完全透明なvideoの読み込みを止めることがある。
  // そのため読み込み中だけ、実体のある小さなプレビューとして置く。
  video.style.cssText="display:block;width:160px;max-width:100%;height:90px;margin:8px 0;background:#000;object-fit:contain";
  status.insertAdjacentElement("afterend",video);

  let actionButton=null;
  const removeUI=()=>{
    if(actionButton&&actionButton.parentNode)actionButton.parentNode.removeChild(actionButton);

  };

function toAudioBuffer(samples,sr){
  const ctx=getAudioContext();
  const buffer=ctx.createBuffer(1,samples.length,sr);
  buffer.copyToChannel(samples,0);
  return buffer;
}

function addDownload(modeKey,mode,variant,blob){
  const fileName=`robolingual-v099-${mode.toLowerCase()}-${variant===0?"a":"b"}.wav`;
  const b=document.createElement("button");
  b.className="download";
  b.type="button";
  b.textContent=variant===0?"Download A":"Download B";
  b.addEventListener("click",()=>saveWavBlob(blob,fileName));
  document.getElementById(`${modeKey}Downloads`).appendChild(b);
}

async function saveWavBlob(blob,fileName){
  const file=new File([blob],fileName,{type:"audio/wav"});
  try{
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fileName});
      return;
    }
  }catch(error){
    if(error&&error.name==="AbortError")return;
    console.warn("Share save failed; falling back to download.",error);
  }
  const url=URL.createObjectURL(blob);
  objectURLs.push(url);
  const a=document.createElement("a");
  a.href=url;
  a.download=fileName;
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function resetSwitches(){
  for(const mode of["normal","abnormal","hyper"]){
    const off=document.querySelector(`input[name="${mode}"][value="off"]`);
    if(off)off.checked=true;
  }
}

async function startMixer(){
  if(mixerRunning)return;
  const ctx=getAudioContext();
  if(ctx.state==="suspended")await ctx.resume();
  const when=ctx.currentTime+.04;
  mixerSources=[];
  mixerGains={};
  for(const mode of["normal","abnormal","hyper"]){
    for(const variant of["a","b"]){
      const buffer=rendered[mode][variant];
      if(!buffer)continue;
      const source=ctx.createBufferSource();
      const gain=ctx.createGain();
      source.buffer=buffer;
      source.loop=true;
      source.loopStart=0;
      source.loopEnd=buffer.duration;
      source.playbackRate.setValueAtTime(masterRate,when);
      gain.gain.setValueAtTime(0,when);
      source.connect(gain).connect(ctx.destination);
      source.start(when);
      mixerSources.push(source);
      mixerGains[`${mode}-${variant}`]=gain;
    }
  }
  if(renderedSoundLogo){
    const logoSource=ctx.createBufferSource();
    const logoGain=ctx.createGain();
    logoSource.buffer=renderedSoundLogo;
    logoSource.loop=true;
    logoSource.loopStart=0;
    logoSource.loopEnd=renderedSoundLogo.duration;
    logoSource.playbackRate.setValueAtTime(masterRate,when);
    logoGain.gain.setValueAtTime(1,when);
    logoSource.connect(logoGain).connect(ctx.destination);
    logoSource.start(when);
    mixerSources.push(logoSource);
    mixerGains.soundLogo=logoGain;
  }
  mixerRunning=true;
}

function updateMixer(){
  const anyOn=["normal","abnormal","hyper"].some(mode=>{
    const selected=document.querySelector(`input[name="${mode}"]:checked`);
    return selected&&selected.value!=="off";
  });
  if(anyOn&&!mixerRunning){
    startMixer().then(applyMixerGains);
  }else{
    applyMixerGains();
  }
}

function sliderToRate(value){
  const v=Number(value)/1000;return Math.pow(3,-v);
}

function setMasterRate(rate){
  masterRate=clamp(rate,1/3,3);
  const now=getAudioContext().currentTime;
  for(const source of mixerSources){
    try{
      source.playbackRate.cancelScheduledValues(now);
      source.playbackRate.setTargetAtTime(masterRate,now,.012);
    }catch(_){}
  }
  speedValue.textContent=`${masterRate.toFixed(2)}×`;
}

function resetMasterRate(){
  speedSlider.value="0";
  setMasterRate(1);
}

function applyMixerGains(){
  if(!mixerRunning)return;
  const ctx=getAudioContext();
  const now=ctx.currentTime;
  let anyOn=false;
  for(const mode of["normal","abnormal","hyper"]){
    const selected=document.querySelector(`input[name="${mode}"]:checked`);
    const value=selected?selected.value:"off";
    if(value!=="off")anyOn=true;
    for(const variant of["a","b"]){
      const gain=mixerGains[`${mode}-${variant}`];
      if(!gain)continue;
      const target=value===variant?1:0;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setTargetAtTime(target,now,.008);
    }
  }
  const logoGain=mixerGains.soundLogo;
  if(logoGain){
    logoGain.gain.cancelScheduledValues(now);
    logoGain.gain.setTargetAtTime(anyOn?1:0,now,.008);
  }
}

function stopMixer(reset=false){
  for(const source of mixerSources){
    try{source.stop()}catch(_){}
    try{source.disconnect()}catch(_){}
  }
  for(const gain of Object.values(mixerGains)){
    try{gain.disconnect()}catch(_){}
  }
  mixerSources=[];
  mixerGains={};
  mixerRunning=false;
  if(reset)resetSwitches();
}
