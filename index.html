<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d6d6d6">
<title>Robolingual</title>
<style>
:root{--bg:#d6d6d6;--panel:#ececec;--shadow:#8b8b8b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#111;font-family:Geneva,Chicago,"Helvetica Neue",Arial,sans-serif;padding:18px}.window{width:min(760px,100%);margin:0 auto;border:2px solid #111;background:var(--panel);box-shadow:6px 6px 0 var(--shadow)}.titlebar{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:2px solid #111;background:repeating-linear-gradient(to bottom,#fff 0,#fff 2px,#aaa 2px,#aaa 4px);font-weight:700}.closebox{width:18px;height:18px;border:2px solid #111;background:#ddd;flex:0 0 auto}.title{background:var(--panel);padding:2px 10px;margin:auto;transform:translateX(-13px)}main{padding:18px}.row{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center;margin-bottom:16px}label{font-weight:700}.filebox{display:flex;gap:10px;align-items:center;min-width:0}button,.file-button,input{font:inherit}button,.file-button{appearance:none;border:2px solid #111;background:#e9e9e9;color:#111;box-shadow:2px 2px 0 #777;padding:10px 14px;cursor:pointer;font-weight:700;border-radius:0}button:active,.file-button:active{box-shadow:none;transform:translate(2px,2px)}button:disabled{color:#777;cursor:not-allowed}input[type=file]{display:none}#filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}#wave{width:100%;height:110px;border:2px solid #111;background:#fff;display:block}.bpm-wrap{display:flex;align-items:center;gap:8px}#bpm{width:92px;border:2px solid #111;background:#fff;padding:9px;border-radius:0;font-weight:700}#translate{width:100%;font-size:20px;padding:15px;background:#111;color:#fff;box-shadow:4px 4px 0 #777;margin:4px 0 18px}#status{min-height:22px;margin:0 0 16px;font-size:14px;font-weight:700}.mode{border-top:2px solid #111;padding:16px 0 2px}.mode h2{margin:0 0 12px;font-size:18px}.outputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:2px solid #111;background:#ddd;padding:10px}.tag{font-size:13px;font-weight:700;margin-bottom:8px}audio{width:100%;height:36px;display:block;margin-bottom:8px}.download{width:100%;padding:8px}.hidden{display:none}@media(max-width:600px){body{padding:10px}main{padding:12px}.row{grid-template-columns:1fr;gap:6px}.outputs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="window"><div class="titlebar"><div class="closebox"></div><div class="title">ROBOLINGUAL</div></div><main>
<div class="row"><label>Source</label><div class="filebox"><label class="file-button" for="source">Choose</label><input id="source" type="file" accept="audio/*,video/mp4,video/quicktime,.mov,.mp4,.m4a,.mp3,.wav"><span id="filename">No source</span></div></div>
<div class="row"><label>Waveform</label><canvas id="wave"></canvas></div>
<div class="row"><label for="bpm">BPM</label><div class="bpm-wrap"><input id="bpm" type="number" min="60" max="260" step="1" value="170"></div></div>
<button id="translate" disabled>Translate</button><div id="status"></div>
<section id="results" class="hidden"><div class="mode"><h2>Normal</h2><div class="outputs" id="normalOutputs"></div></div><div class="mode"><h2>Abnormal</h2><div class="outputs" id="abnormalOutputs"></div></div><div class="mode"><h2>Hyper</h2><div class="outputs" id="hyperOutputs"></div></div></section>
</main></div>
<script>
(()=>{"use strict";const sourceInput=document.getElementById("source"),filename=document.getElementById("filename"),wave=document.getElementById("wave"),bpmInput=document.getElementById("bpm"),translateButton=document.getElementById("translate"),status=document.getElementById("status"),results=document.getElementById("results");let sourceBuffer=null,audioContext=null;const objectURLs=[];const setStatus=t=>status.textContent=t;function getAudioContext(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();return audioContext}function clearURLs(){while(objectURLs.length)URL.revokeObjectURL(objectURLs.pop())}
sourceInput.addEventListener("change",async()=>{clearURLs();results.classList.add("hidden");translateButton.disabled=true;sourceBuffer=null;const file=sourceInput.files&&sourceInput.files[0];if(!file){filename.textContent="No source";drawEmptyWave();return}filename.textContent=file.name;setStatus("Loading...");try{const ctx=getAudioContext(),data=await file.arrayBuffer();sourceBuffer=await ctx.decodeAudioData(data.slice(0));drawWave(sourceBuffer);translateButton.disabled=false;setStatus("Ready")}catch(e){console.error(e);drawEmptyWave();setStatus("This file could not be decoded. WAV / MP3 / M4A are safest. MOV / MP4 support depends on the browser.")}});
translateButton.addEventListener("click",async()=>{if(!sourceBuffer)return;const bpm=clamp(Number(bpmInput.value)||170,60,260);bpmInput.value=String(Math.round(bpm));translateButton.disabled=true;clearURLs();setStatus("Translating...");await nextFrame();try{const mono=toMono(sourceBuffer),sr=sourceBuffer.sampleRate,duration=60/bpm*4*4,total=Math.max(1,Math.floor(duration*sr)),jobs=[["normalOutputs","Normal",0,makeNormal],["normalOutputs","Normal",1,makeNormal],["abnormalOutputs","Abnormal",0,makeAbnormal],["abnormalOutputs","Abnormal",1,makeAbnormal],["hyperOutputs","Hyper",0,makeHyper],["hyperOutputs","Hyper",1,makeHyper]];normalOutputs.innerHTML="";abnormalOutputs.innerHTML="";hyperOutputs.innerHTML="";for(const[targetId,mode,variant,maker]of jobs){const rng=mulberry32(cryptoSeed()),output=maker(mono,sr,bpm,total,rng);normalize(output,.93);const blob=encodeWav(output,sr),url=URL.createObjectURL(blob);objectURLs.push(url);addOutputCard(targetId,mode,variant,url);await nextFrame()}results.classList.remove("hidden");setStatus("Translated")}catch(e){console.error(e);setStatus("Translation failed.")}finally{translateButton.disabled=false}});
function addOutputCard(targetId,mode,variant,url){const card=document.createElement("div");card.className="card";const tag=document.createElement("div");tag.className="tag";tag.textContent=variant===0?"A":"B";const audio=document.createElement("audio");audio.controls=true;audio.preload="metadata";audio.src=url;const a=document.createElement("a");a.href=url;a.download=`robolingual-${mode.toLowerCase()}-${variant===0?"a":"b"}.wav`;const b=document.createElement("button");b.className="download";b.textContent="Download";a.appendChild(b);card.append(tag,audio,a);document.getElementById(targetId).appendChild(card)}
function makeNormal(src,sr,bpm,total,rng){const out=new Float32Array(total),beat=sr*60/bpm;for(let bar=0;bar<4;bar++){const barStart=Math.floor(bar*beat*4),events=2+Math.floor(rng()*2);for(let e=0;e<events;e++){const startBeat=e===0?0:e*4/events+rng()*.25,dest=barStart+Math.floor(startBeat*beat),length=Math.floor((.7+rng()*1.7)*beat),srcStart=chooseSourceStart(src.length,length,rng),basePitch=pick([.74,.84,.94,1,1.12,1.26],rng),curve=rng()*.55-.275,gain=.72+rng()*.18;renderSegment(out,src,dest,length,srcStart,basePitch,curve,gain,rng)}}return out}
function makeAbnormal(src,sr,bpm,total,rng){const out=new Float32Array(total),beat=sr*60/bpm,grid=beat/8;let pos=0;while(pos<total){if(rng()<.18){pos+=Math.floor(grid*(1+Math.floor(rng()*4)));continue}const burstCount=3+Math.floor(rng()*11),sliceLen=Math.max(60,Math.floor(sr*(.018+rng()*.085))),srcStart=chooseSourceStart(src.length,sliceLen*3,rng),interval=Math.max(sliceLen*.55,grid*(.22+rng()*.55));for(let i=0;i<burstCount&&pos<total;i++){const length=Math.floor(sliceLen*(.65+rng()*1.1)),pitch=1,curve=0;renderSegment(out,src,Math.floor(pos),length,srcStart,pitch,curve,.66+rng()*.24,rng);pos+=interval*(.7+rng()*.65)}pos+=grid*rng()*2.5}return out}
function makeHyper(src,sr,bpm,total,rng){const out=new Float32Array(total),beat=sr*60/bpm,bar=beat*4;for(let b=0;b<4;b++){const barStart=Math.floor(b*bar),longStart=barStart+Math.floor(rng()*.25*beat),longLen=Math.floor(beat*(b===3?2.4:1.5+rng()*1.3)),srcStart=chooseSourceStart(src.length,longLen,rng),basePitch=pick([.75,.84,.94,1,1.12,1.26,1.5],rng),curve=b===3?-.15-rng()*.2:rng()*.7-.25;renderSegment(out,src,longStart,longLen,srcStart,basePitch,curve,.72,rng);const burstZone=barStart+Math.floor(beat*(1.2+rng()*1.6)),burstCount=b===2?10+Math.floor(rng()*8):4+Math.floor(rng()*8),sliceLen=Math.floor(sr*(.025+rng()*.06)),burstSource=chooseSourceStart(src.length,sliceLen*4,rng),interval=beat/pick([8,12,16],rng);for(let i=0;i<burstCount;i++){const dest=burstZone+Math.floor(i*interval);if(dest>=barStart+bar)break;const localPitch=basePitch*Math.pow(2,((i%5)-2)/12),localCurve=(i%2?.28:-.18)+(rng()*.18-.09);renderSegment(out,src,dest,Math.floor(sliceLen*(.7+rng()*.8)),burstSource,localPitch,localCurve,.5+rng()*.22,rng)}if(b===3){const hit=barStart+Math.floor(3.45*beat),hitLen=Math.floor(beat*.45),hitSource=chooseSourceStart(src.length,hitLen,rng);renderSegment(out,src,hit,hitLen,hitSource,pick([.5,.75,1],rng),-.35,.9,rng)}}return out}
function renderSegment(out,src,destStart,length,srcStart,pitch,curve,gain,rng){if(length<=1)return;const attack=Math.max(8,Math.floor(length*.06)),release=Math.max(8,Math.floor(length*.12));let phase=srcStart;for(let i=0;i<length;i++){const dest=destStart+i;if(dest<0||dest>=out.length)continue;const t=i/Math.max(1,length-1),ratio=Math.max(.2,pitch*Math.pow(2,curve*(t-.5))),idx0=Math.floor(phase),idx1=Math.min(src.length-1,idx0+1),frac=phase-idx0;if(idx0>=src.length-1)phase=srcStart;const sample=src[idx0]*(1-frac)+src[idx1]*frac;let env=1;if(i<attack)env=i/attack;else if(i>length-release)env=(length-i)/release;const tremolo=.93+.07*Math.sin(t*Math.PI*2*(2+Math.floor(rng()*5)));out[dest]+=sample*gain*Math.max(0,env)*tremolo;phase+=ratio;if(phase>=src.length-1)phase=srcStart}}
function chooseSourceStart(n,w,rng){const margin=Math.min(n-2,Math.max(1,w*2)),max=Math.max(1,n-margin);return Math.floor(rng()*max)}function toMono(buffer){const mono=new Float32Array(buffer.length);for(let ch=0;ch<buffer.numberOfChannels;ch++){const data=buffer.getChannelData(ch);for(let i=0;i<buffer.length;i++)mono[i]+=data[i]/buffer.numberOfChannels}return mono}function normalize(data,target){let peak=0;for(let i=0;i<data.length;i++)peak=Math.max(peak,Math.abs(data[i]));if(peak<1e-7)return;const scale=target/peak;for(let i=0;i<data.length;i++)data[i]*=scale}
function encodeWav(samples,sr){const buffer=new ArrayBuffer(44+samples.length*2),view=new DataView(buffer);writeString(view,0,"RIFF");view.setUint32(4,36+samples.length*2,true);writeString(view,8,"WAVE");writeString(view,12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,sr,true);view.setUint32(28,sr*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);writeString(view,36,"data");view.setUint32(40,samples.length*2,true);let o=44;for(let i=0;i<samples.length;i++,o+=2){const s=Math.max(-1,Math.min(1,samples[i]));view.setInt16(o,s<0?s*32768:s*32767,true)}return new Blob([view],{type:"audio/wav"})}function writeString(view,o,t){for(let i=0;i<t.length;i++)view.setUint8(o+i,t.charCodeAt(i))}
function drawEmptyWave(){const ctx=resizeCanvas(wave);ctx.fillStyle="#fff";ctx.fillRect(0,0,wave.width,wave.height)}function drawWave(buffer){const ctx=resizeCanvas(wave),width=wave.width,height=wave.height,data=toMono(buffer),step=Math.max(1,Math.floor(data.length/width));ctx.fillStyle="#fff";ctx.fillRect(0,0,width,height);ctx.strokeStyle="#111";ctx.lineWidth=Math.max(1,devicePixelRatio||1);ctx.beginPath();for(let x=0;x<width;x++){let min=1,max=-1;const start=x*step,end=Math.min(data.length,start+step);for(let i=start;i<end;i++){const v=data[i];if(v<min)min=v;if(v>max)max=v}ctx.moveTo(x,(1+min)*.5*height);ctx.lineTo(x,(1+max)*.5*height)}ctx.stroke()}function resizeCanvas(canvas){const r=canvas.getBoundingClientRect(),ratio=devicePixelRatio||1;canvas.width=Math.max(1,Math.floor(r.width*ratio));canvas.height=Math.max(1,Math.floor(r.height*ratio));return canvas.getContext("2d")}
const nextFrame=()=>new Promise(r=>requestAnimationFrame(r));const pick=(a,r)=>a[Math.floor(r()*a.length)];const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));function cryptoSeed(){if(window.crypto&&crypto.getRandomValues){const v=new Uint32Array(1);crypto.getRandomValues(v);return v[0]}return(Date.now()^Math.floor(Math.random()*4294967295))>>>0}function mulberry32(seed){return function(){let t=seed+=1831565813;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
window.addEventListener("resize",()=>sourceBuffer?drawWave(sourceBuffer):drawEmptyWave());drawEmptyWave()})();
</script>
</body>
</html>
