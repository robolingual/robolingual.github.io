<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>Robolingual v0.9.30</title>
<style>
:root{--bg:#d6d6d6;--panel:#ececec;--shadow:#8b8b8b;--ink:#111;--accent:#c40000}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family: "Segoe UI", Tahoma, Arial, sans-serif;padding:18px}
.window{width:min(860px,100%);margin:0 auto;border:2px solid var(--ink);background:var(--panel);box-shadow:6px 6px 0 var(--shadow)}
.titlebar{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:2px solid var(--ink);background:repeating-linear-gradient(to bottom,#fff 0,#fff 2px,#aaa 2px,#aaa 4px);font-weight:400}.closebox{width:18px;height:18px;border:2px solid var(--ink);background:#ddd;flex:0 0 auto}.title{background:var(--panel);padding:2px 10px;margin:auto;transform:translateX(-13px)}
main{padding:18px}.row{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin-bottom:12px}label{font-weight:400}.filebox{display:flex;gap:10px;align-items:center;min-width:0}
button,.file-button,input,select{font:inherit}button,.file-button,select{appearance:none;border:2px solid var(--ink);background:#e9e9e9;color:var(--ink);box-shadow:2px 2px 0 #777;padding:10px 14px;cursor:pointer;font-weight:400;border-radius:0}button:active,.file-button:active{box-shadow:none;transform:translate(2px,2px)}button:disabled{color:#777;cursor:not-allowed}input[type=file]{display:none}#filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#waveBox{position:relative;width:100%}#wave{width:100%;height:180px;border:2px solid var(--ink);background:#080008;display:block}#videoReadButton{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);z-index:3;margin:0;padding:12px 18px;background:#111;color:#ff2aa8;border-color:#ff2aa8;box-shadow:3px 3px 0 #7a1457;white-space:nowrap}#videoReadButton:active{transform:translate(calc(-50% + 2px),calc(-50% + 2px));box-shadow:none}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#bpm,#bars{width:92px;border:2px solid var(--ink);background:#fff;padding:9px;border-radius:0;font-weight:400}
#translate{width:100%;font-size:20px;padding:15px;background:var(--ink);color:#fff;box-shadow:4px 4px 0 #777;margin:4px 0 14px}#status{min-height:22px;margin:0 0 16px;font-size:14px;font-weight:400}.mode{border-top:2px solid var(--ink);padding:14px 0}.mode-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.mode h2{margin:0;font-size:18px}.switches{display:flex;gap:8px;align-items:center}.switches input{position:absolute;opacity:0;pointer-events:none}.switches label{display:inline-flex;align-items:center;justify-content:center;min-width:58px;border:2px solid var(--ink);background:#e9e9e9;box-shadow:2px 2px 0 #777;padding:8px 10px;cursor:pointer}.switches input:checked+label{background:var(--ink);color:#fff;box-shadow:none;transform:translate(2px,2px)}.downloads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.download{width:100%;padding:8px}.mixer-layout{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:18px;align-items:stretch}.mixer-main{min-width:0}.speed-panel{border:2px solid var(--ink);background:#ddd;display:flex;flex-direction:column;align-items:center;padding:10px 8px;min-height:340px}.speed-title{font-size:12px;font-weight:900;letter-spacing:.04em;text-align:center}.speed-value{font-family: "Segoe UI", Tahoma, Arial, sans-serif;font-size:18px;font-weight:900;margin:5px 0 7px}.speed-scale{flex:1;display:grid;grid-template-columns:36px 32px;align-items:stretch;justify-content:center;gap:4px;min-height:250px}.speed-labels{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-family: "Segoe UI", Tahoma, Arial, sans-serif;font-size:11px;font-weight:400;padding:4px 0}.speed-slider{width:32px;height:100%;writing-mode:vertical-lr;direction:rtl;accent-color:#111;cursor:ns-resize}.speed-reset{width:100%;padding:7px 3px;margin-top:8px;font-size:11px}.transport{display:flex;justify-content:flex-end;margin:0 0 10px}.stop{min-width:100px}.hidden{display:none}
#waveBox{overflow:hidden}#waveStatus{position:absolute;left:12px;right:12px;bottom:10px;z-index:4;color:#ff7ac4;font-family: "Segoe UI", Tahoma, Arial, sans-serif;font-size:13px;font-weight:900;text-align:center;text-shadow:0 1px 0 #000;pointer-events:none}.wave-video-preview{position:absolute!important;left:50%;top:46%;transform:translate(-50%,-50%);z-index:2;margin:0!important;width:min(220px,55%)!important;height:min(124px,68%)!important;border:1px solid #ff2aa8;box-shadow:0 0 0 2px #080008;object-fit:contain}.performance-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 14px}.performance-controls button{padding:9px 8px;min-width:0}.play-led{background:#0b3517;color:#c9ffd5;border-color:#09260f;transition:background-color .25s,color .25s,box-shadow .25s}.play-led.lit{background:#20d45a;color:#001b08;box-shadow:0 0 10px rgba(32,212,90,.9),2px 2px 0 #08752c}.rec-led{background:#4a0b0b;color:#ffd0d0;border-color:#2b0505;transition:background-color .25s,color .25s,box-shadow .25s}.rec-led.lit{background:#ff2525;color:#240000;box-shadow:0 0 10px rgba(255,37,37,.9),2px 2px 0 #9c0000}.performance-controls button:disabled{opacity:.45}.zip-row{margin-top:12px}.zip-row button{width:100%;background:#111;color:#fff}.downloads{display:none!important}@media(max-width:620px){.mixer-layout{grid-template-columns:minmax(0,1fr) 82px;gap:10px}.speed-panel{padding:8px 5px}.switches{gap:4px}.switches label{min-width:46px;padding:7px 6px}}
@media(max-width:600px){body{padding:10px}main{padding:12px}.row{grid-template-columns:1fr;gap:6px}.outputs{grid-template-columns:1fr}}

/* v0.9.17 — black body + one CHOOSE / READ / TRANSLATE control */
:root{--bg:#050505;--panel:#111;--shadow:#000;--ink:#e9e9e9;--accent:#ff2aa8}
body{background:radial-gradient(circle at 50% 0,#242424 0,#090909 48%,#020202 100%);color:#eee;font-family: "Segoe UI", Tahoma, Arial, sans-serif;background:linear-gradient(#181818,#0d0d0d);box-shadow:0 18px 55px #000, inset 0 0 0 1px #050505;border-radius:12px;overflow:hidden}
.titlebar{height:42px;border-bottom:1px solid #3b3b3b;background:linear-gradient(#252525,#101010);letter-spacing:.16em}.closebox{display:none}.title{background:transparent;color:#f6f6f6;transform:none;text-shadow:0 1px 0 #000}
main{padding:18px}.row{grid-template-columns:100px 1fr}label{color:#aaa;text-transform:uppercase;font-size:12px;letter-spacing:.12em}
button,select{border:1px solid #555;background:linear-gradient(#303030,#171717);color:#eee;box-shadow:0 3px 0 #000;padding:10px 14px;border-radius:5px;text-shadow:0 1px 0 #000}button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}button:disabled{color:#666;border-color:#292929;background:#151515}
#wave{height:210px;border:1px solid #4d1f3b;background:#050005;box-shadow:inset 0 0 22px #000,0 0 0 3px #090909;border-radius:5px}
#waveBox{min-height:210px;border:1px solid #252525;background:#050505;border-radius:7px;padding:4px;box-shadow:inset 0 0 0 1px #000}
#filename{position:absolute;left:14px;right:14px;top:11px;z-index:5;color:#a45a86;font:700 10px/1.2 monospace;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;pointer-events:none}
#mainAction{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:6;min-width:210px;padding:14px 22px;border:1px solid #ff2aa8;background:linear-gradient(#281221,#10070d);color:#ff78c6;box-shadow:0 0 16px rgba(255,42,168,.18),0 4px 0 #250517;letter-spacing:.09em;font-weight:900}
#mainAction:active{transform:translate(-50%,calc(-50% + 2px));box-shadow:0 0 10px rgba(255,42,168,.2),0 2px 0 #250517}
#mainAction.busy{opacity:.55;pointer-events:none}
#waveStatus{bottom:12px;color:#ff70c1;font-size:12px}.wave-video-preview{top:44%;border-color:#ff2aa8;opacity:.55}
#bpm{border:1px solid #555;background:#090909;color:#fff;box-shadow:inset 0 0 0 1px #000;border-radius:4px}
.performance-controls button{border-radius:5px}.mode{border-top:1px solid #333}.mode h2{color:#eee;letter-spacing:.08em}.switches label{border:1px solid #555;background:linear-gradient(#2d2d2d,#151515);color:#aaa;box-shadow:0 2px 0 #000;border-radius:4px}.switches input:checked+label{background:#ff2aa8;color:#16000d;box-shadow:0 0 12px rgba(255,42,168,.5);transform:none}
.speed-panel{border:1px solid #444;background:linear-gradient(#202020,#0d0d0d);border-radius:6px}.speed-title,.speed-value,.speed-labels{color:#ddd}.speed-slider{accent-color:#ff2aa8}.zip-row button{background:linear-gradient(#333,#151515);border-color:#555}.performance-controls{margin-top:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}.waveform-row>label{display:none}#mainAction{min-width:190px;font-size:13px}}

/* v0.9.18 — waveform label removed; white source/status; larger sampler pads */
.waveform-row{display:block}
#filename{color:#fff;font-size:11px;text-shadow:0 1px 2px #000}
#waveStatus{color:#fff;font-size:12px;text-shadow:0 1px 2px #000}
.mixer-layout{align-items:stretch;min-height:390px}
.mixer-main{display:grid;grid-template-rows:repeat(4,minmax(0,1fr)) auto;min-height:100%}
.mode{display:flex;align-items:stretch;padding:10px 0}
.mode-head{width:100%;align-items:stretch}
.mode h2{display:flex;align-items:center;min-width:112px;font-size:19px}
.switches{flex:1;display:grid;grid-template-columns:repeat(5,minmax(46px,1fr));gap:8px;align-items:stretch}
.switches label{min-width:0;min-height:74px;padding:10px 4px;font-size:15px;font-weight:900}
.zip-row{margin-top:10px}.zip-row button{min-height:48px}
.speed-panel{min-height:100%;height:100%}
@media(max-width:620px){
  .mixer-layout{min-height:460px}
  .mode h2{min-width:70px;font-size:13px}
  .switches{grid-template-columns:repeat(5,minmax(32px,1fr));gap:4px}
  .switches label{min-width:0;min-height:68px;padding:8px 2px;font-size:13px}
}

/* v0.9.19 — square hardware layout based on the approved rough */
body{padding:14px;background:#030303;}
.window{width:min(820px,100%);min-height:820px;border-radius:14px;}
.titlebar{height:46px;}
.title{font-size:16px;letter-spacing:.22em;}
main{padding:20px 22px 18px;}
#waveBox{min-height:226px;padding:5px;border-radius:8px;}
#wave{height:214px;}
#mainAction{min-width:290px;padding:16px 24px;font-size:16px;}
.performance-controls{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:9px 8px 0;}
.performance-controls button{min-height:46px;font-size:15px;}
.translate-bpm-row{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:8px;margin:8px 8px 0}.translate-bpm-row #translate{width:100%;min-height:46px;margin:0;padding:10px 14px;font-size:15px;background:linear-gradient(#281221,#10070d);color:#ff78c6;border:1px solid #ff2aa8;box-shadow:0 0 16px rgba(255,42,168,.18),0 3px 0 #250517}.translate-bpm-row #translate:disabled{color:#6d4a5e;border-color:#402138;background:#130b10;box-shadow:0 3px 0 #000}.bpm-panel{position:relative;display:flex;align-items:center;justify-content:flex-start;min-height:46px;border:1px solid #555;border-radius:5px;background:#080808;box-shadow:0 3px 0 #000;padding:0 8px;color:#aaa;overflow:hidden;}
.bpm-panel #bpm{width:76px;border:0;background:transparent;box-shadow:none;padding:7px 2px;color:#fff;font:900 20px/1 monospace;outline:none;}
.bpm-panel span{position:absolute;right:7px;bottom:4px;font:900 10px/1 monospace;letter-spacing:.18em;color:#aaa;}
#results{margin-top:44px;}
.mixer-layout{grid-template-columns:minmax(0,1fr) 118px;gap:16px;min-height:460px;}
.mixer-main{grid-template-rows:repeat(4,1fr) auto;}
.mode{padding:0 4px;border-top:1px solid #333;}
.mode:first-child{border-top:1px solid #333;}
.mode-head{display:grid;grid-template-columns:minmax(150px,1fr) minmax(330px,1.6fr);gap:14px;align-items:center;}
.mode h2{min-width:0;font-size:24px;letter-spacing:.03em;padding-left:8px;}
.switches{grid-template-columns:repeat(5,1fr);gap:8px;}
.switches label{min-height:58px;font-size:17px;border-radius:6px;}
.switches input:disabled+label{color:#666;border-color:#292929;background:#151515;box-shadow:0 2px 0 #000;cursor:not-allowed;}
.switches input:checked+label{background:#ff2aa8;color:#15000d;box-shadow:0 0 18px rgba(255,42,168,.65),0 2px 0 #6d0745;}
.speed-panel{padding:14px 8px 10px;border-radius:7px;}
.speed-title{font-size:13px;line-height:1.4;}
.speed-value{font-size:20px;margin:6px 0 10px;}
.speed-scale{min-height:255px;}
.speed-reset{min-height:34px;}
.zip-row{margin:12px 0 0;}
.zip-row button{min-height:44px;font-size:15px;}
@media(max-width:700px){
  body{padding:8px}.window{min-height:0}.titlebar{height:40px}.title{font-size:13px}
  main{padding:12px}.performance-controls{grid-template-columns:repeat(4,1fr);margin-left:0;margin-right:0;gap:5px}
  .performance-controls button{font-size:11px;padding:8px 3px}.translate-bpm-row{grid-template-columns:minmax(0,1fr) 92px;margin-left:0;margin-right:0;gap:5px}.translate-bpm-row #translate{font-size:12px}.bpm-panel{padding:0 4px}.bpm-panel #bpm{width:58px;font-size:17px}
  #results{margin-top:28px}.mixer-layout{grid-template-columns:minmax(0,1fr) 86px;gap:8px;min-height:440px}
  .mode-head{grid-template-columns:64px 1fr;gap:6px}.mode h2{font-size:13px;padding-left:2px}.switches{grid-template-columns:repeat(5,1fr);gap:4px}.switches label{min-height:50px;font-size:13px;padding:7px 2px}
  #mainAction{min-width:210px;font-size:13px}.speed-title{font-size:10px}.speed-value{font-size:15px}.speed-labels{font-size:9px}
}


/* v0.9.23 — use the existing PLAY button typeface across the UI */
body,button,.file-button,input,select,label,.title,#filename,#waveStatus,#mainAction,#translate,.bpm-panel,.mode h2,.switches label,.speed-title,.speed-value,.speed-labels,.speed-reset,.zip-row button{
  font-family:Arial,Helvetica,sans-serif;
}
button,.file-button,label,.mode h2,.switches label,.speed-title,.speed-value,.speed-labels,.speed-reset,.zip-row button,#mainAction,#translate{
  font-weight:400;
}
.mode h2{
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
@media(max-width:700px){.mode h2{font-size:12px}}

/* v0.9.29 — 固定pxで「基準サイズ」を組み、scale-wrap全体を一括でズームして画面に収める。 */
body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:14px;overflow:hidden}
.window{width:auto;height:auto;margin:0 auto}
.scale-wrap{width:628px;transform-origin:top center}
main{overflow:visible}

.titlebar{position:relative;display:flex;align-items:center;justify-content:center}
.titlebar .title{position:static}
.titlebar .version{position:absolute;right:10px;font-size:10px;font-weight:700;opacity:.55;letter-spacing:.04em}

#waveBox{height:190px;min-height:0;padding:4px}
#wave{width:100%;height:100%}

.performance-controls{margin:8px 0 0}
.performance-controls button{min-height:0;height:38px;padding:0 6px;font-size:12px}

.translate-bpm-row{display:grid;grid-template-columns:76px 1fr 76px;gap:6px;margin:8px 0 0;align-items:stretch}
.dl-wav{font-size:12px;padding:0 4px;background:#1a1a1a;color:#999;border:1px solid #333;border-radius:6px;letter-spacing:0;font-weight:700}
.dl-wav:disabled{opacity:.4}
.translate-bpm-row #translate{min-height:0;height:38px;font-size:12px}
.bpm-panel{min-height:0;height:38px;padding:0 8px}
.bpm-panel #bpm{font-size:16px}
#results{margin-top:16px}

.mixer-layout{display:flex;gap:12px;min-height:0}
.mixer-main{flex:1;display:flex;flex-direction:column;gap:12px}
.mode{padding:0;border-top:none!important}
.mode{position:static}
.mode-head{display:flex;align-items:center;gap:12px}
.mode h2{flex:0 0 70px;font-size:11px;margin:0;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.switches{display:flex;gap:12px}
.switches label{width:96px;height:96px;flex:0 0 96px;min-width:0;min-height:0;padding:0;font-size:19px;border-radius:7px;display:flex;align-items:center;justify-content:center}

/* パッド側の縦合計(68px*4 + 22px*3 = 338px)にMASTER SPEED側を固定pxで一致させる（JS計測に頼らない） */
.speed-panel{flex:0 0 70px;display:flex;flex-direction:column;height:420px;padding:6px 4px;overflow:hidden}
.speed-title{display:none!important}
.speed-value{margin:0 0 6px!important;font-size:13px}
.speed-scale{flex:1;min-height:0}
.speed-reset-label{cursor:pointer;font-weight:900;text-decoration:underline;text-underline-offset:2px}
.speed-reset-label:active{opacity:.6}

.preset-row{display:flex;gap:6px;margin:6px 0 0}
.preset-btn{flex:1;font-size:10px;padding:6px 2px;background:#1a1a1a;color:#999;border:1px solid #333;border-radius:6px;letter-spacing:0;cursor:pointer}
.preset-btn.active{color:#ff2aa8;border-color:#ff2aa8}
.preset-btn:disabled{opacity:.4;cursor:default}

</style>
</head>
<body>
<div class="window"><div class="scale-wrap" id="scaleWrap"><div class="titlebar"><div class="closebox"></div><div class="title">ROBOLINGUAL</div><div class="version">v0.9.30</div></div><main>
<input id="source" type="file" accept="audio/*,video/*,.wav,.mp3,.m4a,.aac,.mp4,.m4v,.mov,.qt">
<div class="row waveform-row"><div><div id="waveBox"><canvas id="wave"></canvas><div id="filename">NO SOURCE</div><button id="mainAction" type="button">CHOOSE SOURCE</button><div id="waveStatus">Waiting for file...</div></div>
<div class="preset-row" aria-label="Preset samples">
  <button class="preset-btn" type="button" data-preset="1">PRESET 1</button>
  <button class="preset-btn" type="button" data-preset="2">PRESET 2</button>
  <button class="preset-btn" type="button" data-preset="3">PRESET 3</button>
</div>
<div class="performance-controls" aria-label="Recorded performance controls"><button id="performancePlay" class="play-led" type="button" disabled>▶ PLAY</button><button id="performanceStop" type="button">■ STOP</button><button id="performanceRec" class="rec-led" type="button" disabled>● REC</button><button id="performanceSave" type="button" disabled>SAVE</button></div><div class="translate-bpm-row"><button id="downloadAll" class="dl-wav" type="button" disabled>DL WAV</button><button id="translate" type="button" disabled>TRANSLATE</button><label class="bpm-panel" for="bpm"><input id="bpm" type="number" min="60" max="260" step="1" value="170"><span>BPM</span></label><input id="bars" type="hidden" value="4"></div></div></div>
<section id="results">
<div class="mixer-layout">
<div class="mixer-main">

<div class="mode" data-mode="normal">
  <div class="mode-head"><h2>NINJA</h2><div class="switches">
    <input id="normalA" type="radio" disabled name="normal" value="a"><label for="normalA">A</label>
    <input id="normalB" type="radio" disabled name="normal" value="b"><label for="normalB">B</label>
    <input id="normalC" type="radio" disabled name="normal" value="c"><label for="normalC">C</label>
    <input id="normalD" type="radio" disabled name="normalD" value="d"><label for="normalD">D</label>
  </div></div>
  <div class="downloads" id="normalDownloads"></div>
</div>
<div class="mode" data-mode="abnormal">
  <div class="mode-head"><h2>KILLER</h2><div class="switches">
    <input id="abnormalA" type="radio" disabled name="abnormal" value="a"><label for="abnormalA">A</label>
    <input id="abnormalB" type="radio" disabled name="abnormal" value="b"><label for="abnormalB">B</label>
    <input id="abnormalC" type="radio" disabled name="abnormal" value="c"><label for="abnormalC">C</label>
    <input id="abnormalD" type="radio" disabled name="abnormalD" value="d"><label for="abnormalD">D</label>
  </div></div>
  <div class="downloads" id="abnormalDownloads"></div>
</div>
<div class="mode" data-mode="hyper">
  <div class="mode-head"><h2>BANKER</h2><div class="switches">
    <input id="hyperA" type="radio" disabled name="hyper" value="a"><label for="hyperA">A</label>
    <input id="hyperB" type="radio" disabled name="hyper" value="b"><label for="hyperB">B</label>
    <input id="hyperC" type="radio" disabled name="hyper" value="c"><label for="hyperC">C</label>
    <input id="hyperD" type="radio" disabled name="hyperD" value="d"><label for="hyperD">D</label>
  </div></div>
  <div class="downloads" id="hyperDownloads"></div>
</div>
<div class="mode" data-mode="glitch">
  <div class="mode-head"><h2>WITCH</h2><div class="switches">
    <input id="glitchA" type="radio" disabled name="glitch" value="a"><label for="glitchA">A</label>
    <input id="glitchB" type="radio" disabled name="glitch" value="b"><label for="glitchB">B</label>
    <input id="glitchC" type="radio" disabled name="glitch" value="c"><label for="glitchC">C</label>
    <input id="glitchD" type="radio" disabled name="glitchD" value="d"><label for="glitchD">D</label>
  </div></div>
  <div class="downloads" id="glitchDownloads"></div>
</div>
</div>
<aside class="speed-panel" aria-label="Master speed">
  <div class="speed-title">MASTER<br>SPEED</div>
  <div id="speedValue" class="speed-value">1.00×</div>

function getAudioContext(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();return audioContext}
async function loadSoundLogo(){
  if(soundLogoBuffer)return soundLogoBuffer;
  const ctx=getAudioContext();
  const response=await fetch(SOUND_LOGO_DATA);
  const data=await response.arrayBuffer();
  soundLogoBuffer=await ctx.decodeAudioData(data.slice(0));
  return soundLogoBuffer;
}
async function playSoundLogoOneShot(){
  try{
    const ctx=getAudioContext();
    if(ctx.state==="suspended")await ctx.resume();
    const buffer=await loadSoundLogo();
    const source=ctx.createBufferSource();
    const gain=ctx.createGain();
    gain.gain.value=.9;
    source.buffer=buffer;
    source.connect(gain);
    gain.connect(ctx.destination);
    source.start();
  }catch(error){console.warn("Sound logo playback failed",error)}
}
function buildSoundLogoTrack(total,sr,bpm){
  if(!soundLogoBuffer)return null;
  const out=getAudioContext().createBuffer(1,total,sr);
  const dest=out.getChannelData(0);
  const beat=sr*60/bpm;
  const start=Math.floor(14*beat); // 4小節目・3拍目
  const channels=soundLogoBuffer.numberOfChannels;
  const ratio=soundLogoBuffer.sampleRate/sr;
  const available=Math.max(0,total-start);
  const frames=Math.min(available,Math.floor(soundLogoBuffer.length/ratio));
  for(let i=0;i<frames;i++){
    const pos=i*ratio,p0=Math.floor(pos),p1=Math.min(soundLogoBuffer.length-1,p0+1),frac=pos-p0;
    let sample=0;
    for(let ch=0;ch<channels;ch++){
      const d=soundLogoBuffer.getChannelData(ch);
      sample+=(d[p0]*(1-frac)+d[p1]*frac)/channels;
    }
    dest[start+i]=sample;
  }
  // 埋め込みMP3の音量差を吸収し、サウンドロゴを常に前へ出す。
  let peak=0;
  for(let i=start;i<start+frames;i++)peak=Math.max(peak,Math.abs(dest[i]));
  if(peak>1e-7){
    const scale=.98/peak;
    for(let i=start;i<start+frames;i++)dest[i]*=scale;
  }
  return out;
}

function isVideoFile(file){
  const type=(file.type||"").toLowerCase();
  const name=(file.name||"").toLowerCase();
  if(type.startsWith("video/"))return true;
  if(type.startsWith("audio/"))return false;
  if(/\.(mp4|m4v|mov|qt|webm|3gp|3g2|avi|mkv)$/i.test(name))return true;
  if(/\.(wav|mp3|m4a|aac|flac|ogg|oga|opus|aif|aiff)$/i.test(name))return false;
  // iPhoneの「写真」経由では MIME や拡張子が空になる場合がある。
  // 不明なメディアは、止まり続ける decodeAudioData へ送らず動画経路に倒す。
  return true;
}

async function decodeSourceFile(ctx,file,isVideo){
  if(!isVideo){
    const data=await file.arrayBuffer();
    return await ctx.decodeAudioData(data.slice(0));
  }

  // 動画コンテナをdecodeAudioDataへ渡すと、iPhone Safariでは
  // 失敗せずPromiseが止まり続ける場合がある。
  // 動画は形式・容量を問わず、必ず明示タップの再生経由で抽出する。
  return await extractVideoAudioByPlayback(ctx,file);
}

async function extractVideoAudioByPlayback(ctx,file){
  const url=URL.createObjectURL(file);
  objectURLs.push(url);

  const video=document.createElement("video");
  video.preload="metadata";
  video.playsInline=true;
  video.setAttribute("playsinline","");
  video.setAttribute("webkit-playsinline","");
  video.src=url;
  video.volume=1;
  video.muted=false;
  video.controls=false;
  video.disablePictureInPicture=true;
  // iOS Safariは画面外・極小・完全透明なvideoの読み込みを止めることがある。
  // そのため読み込み中だけ、実体のある小さなプレビューとして置く。
  video.className="wave-video-preview";
  waveBox.appendChild(video);

  let actionButton=null;
  const removeUI=()=>{
    pendingVideoStart=null;
    actionButton=null;
  };
  const removeVideo=()=>{
    removeUI();
    try{video.pause()}catch(_){}
    video.removeAttribute("src");
    try{video.load()}catch(_){}
    if(video.parentNode)video.parentNode.removeChild(video);
  };

  // 写真アプリから選んだ動画は、選択直後のユーザー操作権限がここまで残らないことがある。
  // 自動再生に賭けず、最初から明示的な1タップで開始する。
  setStatus("Video selected — tap READ VIDEO");
  actionButton=mainAction;
  setMainAction("read","READ VIDEO");
  // Safariにボタンを先に描画させる。Web Audioの準備はその次に行う。
  await new Promise(resolve=>requestAnimationFrame(()=>resolve()));

    const input=event.inputBuffer;

    let timeout=null;

      video.removeEventListener("error",onError);
      video.removeEventListener("timeupdate",onProgress);
      pendingVideoStart=null;
    };
    const finish=error=>{
      if(done)return;
      done=true;finished=true;
      cleanup();
      processor.onaudioprocess=null;
      try{mediaSource.disconnect()}catch(_){}
      try{processor.disconnect()}catch(_){}
      try{silentGain.disconnect()}catch(_){}
      removeVideo();
      error?reject(error):resolve();
    };
    const onEnded=()=>finish();
    const onError=()=>finish(new Error("Safari could not open or play this video."));
    const onProgress=()=>{
      if(!videoDuration&&Number.isFinite(video.duration))videoDuration=video.duration;
      const pct=videoDuration>0?Math.min(99,Math.max(0,Math.round(video.currentTime/videoDuration*100))):0;
      setStatus(`Reading video audio... ${pct}% — keep Safari open`);
    };
    const onStart=async()=>{
      setMainAction("busy","STARTING...",true);
      try{
        if(ctx.state==="suspended")await ctx.resume();
        video.currentTime=0;
        video.load();
        setStatus("Opening video...");
        await video.play();
        removeUI();
        if(Number.isFinite(video.duration)&&video.duration>0)videoDuration=video.duration;
        timeout=setTimeout(()=>finish(new Error("Video audio extraction timed out.")),Math.max(60000,((videoDuration||30)+45)*1000));
      }catch(error){
        finish(new Error("Safari could not start the selected video."));
      }
    };

    video.addEventListener("ended",onEnded,{once:true});
    video.addEventListener("error",onError,{once:true});
    video.addEventListener("timeupdate",onProgress);
    pendingVideoStart=onStart;
  });

  if(capturedFrames<1)throw new Error("No audio track was found in this video.");

  const duration=videoDuration>0?videoDuration:capturedFrames/ctx.sampleRate;
  const expectedFrames=Math.ceil(duration*ctx.sampleRate);
  const outputFrames=Math.min(capturedFrames,expectedFrames+4096);
  const out=ctx.createBuffer(1,outputFrames,ctx.sampleRate);
  const target=out.getChannelData(0);
  let offset=0;
  for(const chunk of monoChunks){
    if(offset>=outputFrames)break;
    const count=Math.min(chunk.length,outputFrames-offset);
    target.set(chunk.subarray(0,count),offset);
    offset+=count;
  }
  return out;
}

function scheduleIntroAnimation(bpm){
  // TRANSLATE押下（サウンドロゴ再生）と同時に走る、170BPMで2拍分のパッド点灯演出。
  const beatMs=60000/bpm;
  const order=["normalA","normalB","normalC","normalD","abnormalD","hyperD","glitchD","glitchC","glitchB","glitchA","hyperA","abnormalA","abnormalB","abnormalC","hyperC","hyperB"];
  const onDur=beatMs/20,stepDur=beatMs/16;
  const labels=order.map(id=>document.querySelector(`label[for="${id}"]`)).filter(Boolean);
  // 1拍目の消灯処理が2拍目の全灯を巻き戻してしまわないよう、2拍目開始と同時に無効化する。
  const cancelToken={cancelled:false};
  // 1拍目：渦を巻くように16個を順番に点灯→フェード消灯（1/16拍間隔×16=ちょうど1拍）。
  order.forEach((id,i)=>{setTimeout(()=>flashPadOnce(id,onDur,cancelToken),i*stepDur)});
  // 2拍目：16個同時に点灯→0.5拍保持→0.375拍かけてフェードアウト→残り0.125拍は消灯を維持。
  const beat2Start=beatMs;
  setTimeout(()=>{
    cancelToken.cancelled=true;
    labels.forEach(label=>setPadGlow(label,true));
  },beat2Start);
  setTimeout(()=>{labels.forEach(label=>fadePadGlow(label,beatMs*.375))},beat2Start+beatMs*.5);
  setTimeout(()=>{labels.forEach(label=>clearPadGlow(label))},beat2Start+beatMs);
}

async function saveBlob(blob,fileName){
  let file=null;
  try{file=new File([blob],fileName,{type:blob.type||"application/octet-stream"})}catch(_){file=null}
  try{
    if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fileName});
      return true;
    }
  }catch(error){
    if(error&&error.name==="AbortError")return false;
    console.warn("Share save failed; falling back to download.",error);
  }
  const url=URL.createObjectURL(blob);
  objectURLs.push(url);
  const a=document.createElement("a");
  a.href=url;
  a.download=fileName;
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>{try{URL.revokeObjectURL(url)}catch(_){ }},30000);
  return true;
}

function applyMixerGains(){
  if(!mixerRunning)return;
  const ctx=getAudioContext();
  const now=ctx.currentTime;
  let anyOn=false;
  for(const mode of["normal","abnormal","hyper","glitch"]){
    const selected=document.querySelector(`input[name="${mode}"]:checked`);
    const value=selected?selected.value:"off";
    if(value!=="off")anyOn=true;
    for(const variant of["a","b","c"]){
      const gain=mixerGains[`${mode}-${variant}`];
      if(!gain)continue;
      const target=value===variant?1:0;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setTargetAtTime(target,now,.008);

  const logoGain=mixerGains.soundLogo;
  if(logoGain){
    logoGain.gain.cancelScheduledValues(now);
    logoGain.gain.setTargetAtTime(anyOn?1:0,now,.008);
  }

function triggerOneShotD(mode){
  // Dは4系統ループの仕組みから独立：押した瞬間に単発で再生する（他の再生状況とは無関係）。
  // Dのバッファは常に「全体(4小節)の先頭1/4だけに音がある」構造なので、
  // 無音スキャンに頼らず、構造的に確実な1/4の時点で再生を止める。
  const buffer=rendered[mode]&&rendered[mode].d;
  if(!buffer)return;
  const ctx=getAudioContext();
  if(ctx.state==="suspended")ctx.resume();
  const source=ctx.createBufferSource();
  const gain=ctx.createGain();
  source.buffer=buffer;
  source.loop=false;
  source.playbackRate.setValueAtTime(masterRate,ctx.currentTime);
  gain.gain.setValueAtTime(1,ctx.currentTime);
  source.connect(gain).connect(getMixerMaster());
  const contentSeconds=buffer.duration/4;
  const rate=Math.max(.05,masterRate);

  source.start(ctx.currentTime,0,contentSeconds);

  source.onended=()=>{
    try{source.disconnect()}catch(_){}

   const sl=pickWeightedSlice(slices,rng,true);
   const dest=base+Math.floor(beatIdx*beat+third*(beat/3));
   renderOneShot(out,src,dest,sl.start,Math.min(sl.length,hitLen),gain);
 };

 hit(1,0);                     // beat1: Aのみ
 hit(2,0);hit(2,1);hit(2,2);   // beat2: ABC(3連符フル)
 hit(3,1);                     // beat3: Bのみ（3連符の真ん中でシンコペーション）
}
function tripletPatternTwo(out,src,base,beat,slices,sr,rng,hard){
 // 3連符パターン②：[ABC][ABC][ABC][ABC]、1音づつ半音上昇⇔半音6つ分（6音で1周期、1小節で2周期）
 const gain=(hard?.8:.58)+rng()*.08;
 const hitLen=Math.max(Math.floor(sr*.025),Math.floor(beat/3*.85));
 const sl=pickWeightedSlice(slices,rng,true);
 let noteIndex=0;
 for(let beatIdx=0;beatIdx<4;beatIdx++){
   for(let t=0;t<3;t++){
     const semitone=noteIndex%6;
     const dest=base+Math.floor(beatIdx*beat+t*(beat/3));
     renderPitchedOneShot(out,src,dest,sl.start,Math.min(sl.length,hitLen),gain,semitone);
     noteIndex++;
   }
 }
}
function maybeAddTripletPattern(out,src,base,beat,slices,sr,rng,hard,probability){
 // NORMAL/ABNORMAL(→HYPERは合成で継承)のA/Bに、確率で3連符パターンを重ねる共通処理。
 if(rng()>=probability)return;
 if(rng()<.5)tripletPatternOne(out,src,base,beat,slices,sr,rng,hard);

function renderNatural(out,src,dest,sl,target,gain,rng){if(target<=0)return;const copy=Math.min(sl.length,target);renderOneShot(out,src,dest,sl.start,copy,gain);if(target>copy){const tailStart=Math.max(sl.start,sl.end-Math.min(Math.floor((sl.end-sl.start)*.35),Math.floor(src.length*.02)+Math.floor((sl.end-sl.start)*.2))),tailLen=Math.max(64,sl.end-tailStart);let pos=copy;while(pos<target&&dest+pos<out.length){const chunk=Math.min(tailLen,target-pos);for(let i=0;i<chunk;i++){const d=dest+pos+i,s=tailStart+(i%tailLen),fade=Math.min(1,i/64,(chunk-i)/64);out[d]+=src[s]*gain*.78*Math.max(.15,fade)}pos+=chunk}}}
function renderReversedOneShot(out,src,dest,start,length,gain){
  // GLITCH用：スライスを逆再生して張り付ける。
  const attack=Math.min(24,Math.max(4,Math.floor(length*.02))),release=Math.max(12,Math.floor(length*.08));

    if(d>=out.length||d<0||s<0||s>=src.length)break;
    let env=1;
    if(i<attack)env=i/attack;
    if(i>length-release)env=Math.max(0,(length-i)/release);

  }

function renderStutterBurst(out,src,dest,sl,windowLen,sr,rng,repeats,reverseChance){

  const step=Math.max(Math.floor(sr*.012),Math.floor(windowLen/Math.max(1,repeats)));
  for(let r=0;r<repeats;r++){
    const d=Math.floor(dest+r*step);
    if(d>=out.length)break;
    const len=Math.max(Math.floor(sr*.01),Math.min(sl.length,step));
    const gain=.62+rng()*.18;
    if(rng()<reverseChance)renderReversedOneShot(out,src,d,sl.start,len,gain);
    else renderOneShot(out,src,d,sl.start,len,gain);
  }
}
function bitcrushInPlace(data,bits,holdStep){
  // GLITCH用：量子化とサンプル&ホールドでローファイに潰す。音声データを直接書き換える。
  const levels=Math.pow(2,Math.max(1,bits))/2;
  const step=Math.max(1,Math.floor(holdStep));
  let held=0;
  for(let i=0;i<data.length;i++){
    if(i%step===0)held=Math.round(data[i]*levels)/levels;
    data[i]=held;
  }
}

function encodeWav(samples,sr){const buffer=new ArrayBuffer(44+samples.length*2),view=new DataView(buffer);writeString(view,0,"RIFF");view.setUint32(4,36+samples.length*2,true);writeString(view,8,"WAVE");writeString(view,12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,sr,true);view.setUint32(28,sr*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);writeString(view,36,"data");view.setUint32(40,samples.length*2,true);let o=44;for(let i=0;i<samples.length;i++,o+=2){const s=Math.max(-1,Math.min(1,samples[i]));view.setInt16(o,s<0?s*32768:s*32767,true)}return new Blob([view],{type:"audio/wav"})}

function drawPinkGrid(ctx,width,height){
  ctx.fillStyle="#080008";ctx.fillRect(0,0,width,height);
  const ratio=devicePixelRatio||1;
  ctx.strokeStyle="rgba(255,42,168,.30)";ctx.lineWidth=Math.max(1,ratio*.65);
  const xStep=width/16,yStep=height/8;
  ctx.beginPath();
  for(let x=0;x<=width+.5;x+=xStep){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,height)}

function fitScaleWrap(){
  // 中身は固定pxの基準サイズのまま組み、scale-wrap全体をinnerWidth/innerHeightに収まるよう
  // 一括でズームする（screen.heightは埋め込みプレビュー環境で実際の表示枠と食い違うため使わない）。
  const wrap=document.getElementById("scaleWrap");
  if(!wrap)return;
  wrap.style.transform="none";
  const nativeW=wrap.offsetWidth,nativeH=wrap.offsetHeight;
  if(!nativeW||!nativeH)return;
  const availW=innerWidth-28,availH=innerHeight-28;
  const scale=Math.min(1,availW/nativeW,availH/nativeH);
  wrap.style.transform=`scale(${scale})`;
