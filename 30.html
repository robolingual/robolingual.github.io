<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Robolingual v0.9.31</title>
<style>
:root{--bg:#d6d6d6;--panel:#ececec;--shadow:#8b8b8b;--ink:#111;--accent:#c40000}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
  padding:10px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.window{
  width:100%;
  max-width:860px;
  margin:0 auto;
  border:2px solid var(--ink);
  background:var(--panel);
  box-shadow:6px 6px 0 var(--shadow);
}
.titlebar{
  height:34px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 8px;
  border-bottom:2px solid var(--ink);
  background:repeating-linear-gradient(to bottom,#fff 0,#fff 2px,#aaa 2px,#aaa 4px);
  font-weight:400;
}
.closebox{width:18px;height:18px;border:2px solid var(--ink);background:#ddd;flex:0 0 auto}
.title{background:var(--panel);padding:2px 10px;border:2px solid var(--ink);font-size:12px;letter-spacing:1px}
.content{padding:12px;display:flex;flex-direction:column;gap:12px}

.row{display:grid;grid-template-columns:1fr 220px;gap:12px}
@media(max-width:768px){.row{grid-template-columns:1fr}}

.panel{
  border:2px solid var(--ink);
  background:#dfdfdf;
  padding:10px;
  box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #b5b5b5;
}
.panel-title{
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:6px;
  color:#555;
  display:flex;
  justify-content:space-between;
}

.screen-container{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#111;
  border:2px solid var(--ink);
  overflow:hidden;
}
canvas{width:100%;height:100%;display:block}
.screen-overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.75);
  color:#fff;
  padding:15px;
  text-align:center;
  cursor:pointer;
}

.btn{
  background:#dcdcdc;
  border:2px solid var(--ink);
  padding:10px 12px;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
  box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #888;
  text-align:center;
}
.btn:active{box-shadow:inset 2px 2px 0 #888, inset -2px -2px 0 #fff;transform:translate(1px,1px)}
.btn.primary{background:var(--accent);color:#fff}
.btn.active{background:#111;color:#fff;box-shadow:inset 2px 2px 0 #000, inset -2px -2px 0 #444}

.grid-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}

.pad-bank{display:flex;flex-direction:column;gap:6px}
.pad-row{display:grid;grid-template-columns:75px repeat(4,1fr);gap:6px;align-items:center}
@media(max-width:480px){
  .pad-row{grid-template-columns:60px repeat(4,1fr)}
}
.pad-label{font-size:10px;font-weight:700;letter-spacing:0.5px}
.pad{
  aspect-ratio:1;
  background:#ccc;
  border:2px solid var(--ink);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #999;
}
.pad:active,.pad.active{background:var(--accent);color:#fff;box-shadow:inset 2px 2px 0 #600, inset -2px -2px 0 #f88}

.knob-row{display:flex;gap:12px;align-items:center;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}

.log{
  background:#050505;
  color:#00ff66;
  font-family:monospace;
  font-size:11px;
  padding:6px;
  border:2px solid var(--ink);
  height:65px;
  overflow-y:auto;
  white-space:pre-wrap;
}

input[type="file"]{display:none}
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="closebox"></div>
    <div class="title">ROBOLINGUAL v0.9.31</div>
  </div>
  <div class="content">
    
    <div class="row">
      <div class="panel">
        <div class="panel-title"><span>SOURCE & WAVEFORM</span><span id="fileInfo">No File</span></div>
        <div class="screen-container" id="dropZone">
          <canvas id="waveformCanvas"></canvas>
          <div class="screen-overlay" id="overlayBtn">
            <div style="font-size:13px;font-weight:700;margin-bottom:4px">CHOOSE AUDIO / VIDEO</div>
            <div style="font-size:10px;color:#aaa">Tap to select file</div>
          </div>
        </div>
        <div class="grid-controls">
          <button class="btn" id="playBtn">PLAY</button>
          <button class="btn" id="stopBtn">STOP</button>
          <button class="btn primary" id="recBtn">REC</button>
        </div>
      </div>

      <div class="panel" style="display:flex;flex-direction:column;justify-content:space-between">
        <div>
          <div class="panel-title">MASTER SPEED</div>
          <div class="knob-row" style="margin-bottom:8px">
            <input type="range" id="speedRange" min="0.33" max="3.0" step="0.01" value="1.0">
            <span id="speedVal" style="font-family:monospace;font-weight:bold;width:40px;text-align:right">1.00x</span>
          </div>
          <div class="panel-title">TRANSLATE / GRID</div>
          <button class="btn" id="translateBtn" style="width:100%;margin-bottom:6px">TRANSLATE BEATS</button>
        </div>
        <div>
          <div class="panel-title">STATUS LOG</div>
          <div class="log" id="logBox">Ready. Tap screen to load file.</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">SOUND TEXTURES & MODES</div>
      <div class="pad-bank">
        <div class="pad-row">
          <div class="pad-label">NORMAL</div>
          <div class="pad" data-mode="normal" data-var="0">A</div>
          <div class="pad" data-mode="normal" data-var="1">B</div>
          <div class="pad" data-mode="normal" data-var="2">C</div>
          <div class="pad" data-mode="normal" data-var="3">D</div>
        </div>
        <div class="pad-row">
          <div class="pad-label">ABNORMAL</div>
          <div class="pad" data-mode="abnormal" data-var="0">A</div>
          <div class="pad" data-mode="abnormal" data-var="1">B</div>
          <div class="pad" data-mode="abnormal" data-var="2">C</div>
          <div class="pad" data-mode="abnormal" data-var="3">D</div>
        </div>
        <div class="pad-row">
          <div class="pad-label">HYPER</div>
          <div class="pad" data-mode="hyper" data-var="0">A</div>
          <div class="pad" data-mode="hyper" data-var="1">B</div>
          <div class="pad" data-mode="hyper" data-var="2">C</div>
          <div class="pad" data-mode="hyper" data-var="3">D</div>
        </div>
        <div class="pad-row">
          <div class="pad-label">GLITCH</div>
          <div class="pad" data-mode="glitch" data-var="0">A</div>
          <div class="pad" data-mode="glitch" data-var="1">B</div>
          <div class="pad" data-mode="glitch" data-var="2">C</div>
          <div class="pad" data-mode="glitch" data-var="3">D</div>
        </div>
      </div>
    </div>

    <button class="btn" id="downloadZipBtn" style="width:100%;padding:12px;font-size:13px">DOWNLOAD ALL PATTERNS (ZIP)</button>
  </div>
</div>

<input type="file" id="fileInput" accept="audio/*,video/*">

<script>
let audioCtx = null;
let sourceBuffer = null;
let audioDuration = 0;
let transients = [];
let currentMode = 'normal';
let currentVar = 0;
let isPlaying = false;
let currentSourceNode = null;
let masterSpeed = 1.0;

const logBox = document.getElementById('logBox');
function log(msg) {
  logBox.textContent += "\n" + msg;
  logBox.scrollTop = logBox.scrollHeight;
}

const fileInput = document.getElementById('fileInput');
const overlayBtn = document.getElementById('overlayBtn');
const dropZone = document.getElementById('dropZone');

overlayBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  log(`Loading: ${file.name}...`);
  try {
    const arrayBuffer = await file.arrayBuffer();
    sourceBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    audioDuration = sourceBuffer.duration;
    document.getElementById('fileInfo').textContent = `${file.name.substring(0,12)}... (${audioDuration.toFixed(1)}s)`;
    log(`Loaded! Duration: ${audioDuration.toFixed(2)}s`);
    detectTransients();
    drawWave();
  } catch (err) {
    log(`Error: ${err.message}`);
  }
}

function detectTransients() {
  transients = [];
  if (!sourceBuffer) return;
  const data = sourceBuffer.getChannelData(0);
  const sampleRate = sourceBuffer.sampleRate;
  const hopSize = Math.floor(sampleRate * 0.05);
  let prevEnergy = 0;
  for (let i = 0; i < data.length; i += hopSize) {
    let energy = 0;
    for (let j = 0; j < hopSize && (i + j) < data.length; j++) {
      energy += Math.abs(data[i + j]);
    }
    energy /= hopSize;
    if (energy > prevEnergy * 1.5 && energy > 0.05) {
      transients.push(i / sampleRate);
    }
    prevEnergy = energy;
  }
  if (transients.length === 0) {
    for (let t = 0; t < audioDuration; t += 0.5) transients.push(t);
  }
  log(`Detected ${transients.length} points.`);
}

const canvas = document.getElementById('waveformCanvas');
const ctx = canvas.getContext('2d');

function drawWave() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  if (!sourceBuffer) return;
  const data = sourceBuffer.getChannelData(0);
  const step = Math.ceil(data.length / canvas.width);
  const amp = canvas.height / 2;
  
  ctx.strokeStyle = '#00ff66';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < canvas.width; i++) {
    let min = 1.0, max = -1.0;
    for (let j = 0; j < step; j++) {
      const datum = data[(i * step) + j];
      if (datum < min) min = datum;
      if (datum > max) max = datum;
    }
    ctx.moveTo(i, (1 + min) * amp);
    ctx.lineTo(i, (1 + max) * amp);
  }
  ctx.stroke();

  ctx.strokeStyle = '#ff2a85';
  transients.forEach(t => {
    const x = (t / audioDuration) * canvas.width;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  });
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (!sourceBuffer) return log('Load file first.');
  if (isPlaying) stopAudio();
  playCurrentPattern();
});

document.getElementById('stopBtn').addEventListener('click', stopAudio);

function stopAudio() {
  if (currentSourceNode) {
    try { currentSourceNode.stop(); } catch(e){}
    currentSourceNode = null;
  }
  isPlaying = false;
  log('Stopped.');
}

function playCurrentPattern() {
  if (!sourceBuffer) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  currentSourceNode = audioCtx.createBufferSource();
  currentSourceNode.buffer = sourceBuffer;
  currentSourceNode.playbackRate.value = masterSpeed;
  currentSourceNode.connect(audioCtx.destination);
  currentSourceNode.start(0);
  isPlaying = true;
  log(`Playing [${currentMode.toUpperCase()}-${currentVar+1}]`);
}

document.querySelectorAll('.pad').forEach(pad => {
  pad.addEventListener('click', (e) => {
    document.querySelectorAll('.pad').forEach(p => p.classList.remove('active'));
    pad.classList.add('active');
    currentMode = pad.getAttribute('data-mode');
    currentVar = parseInt(pad.getAttribute('data-var'));
    if (isPlaying) {
      stopAudio();
      playCurrentPattern();
    }
  });
});

const speedRange = document.getElementById('speedRange');
const speedVal = document.getElementById('speedVal');
speedRange.addEventListener('input', (e) => {
  masterSpeed = parseFloat(e.target.value);
  speedVal.textContent = masterSpeed.toFixed(2) + 'x';
  if (currentSourceNode && currentSourceNode.playbackRate) {
    currentSourceNode.playbackRate.value = masterSpeed;
  }
});

document.getElementById('translateBtn').addEventListener('click', () => {
  if (!sourceBuffer) return log('Load file first.');
  log('Translating beats...');
  detectTransients();
  drawWave();
  log('Done.');
});

document.getElementById('downloadZipBtn').addEventListener('click', () => {
  if (!sourceBuffer) return log('Load file first.');
  log('Preparing ZIP archive...');
  setTimeout(() => log('ZIP ready (Mock).'), 800);
});
</script>
</body>
</html>
